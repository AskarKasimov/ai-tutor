name: Backend CI
on:
  push:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-ci.yaml'
  pull_request:
    paths:
      - 'services/backend/**'
      - '.github/workflows/backend-ci.yaml'
permissions:
  contents: read
jobs:
  test:
    name: Backend tests, vet and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: ai_tutor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_tutor_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres:test-only-password@localhost:5432/ai_tutor_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/backend/go.mod
          cache: true
          cache-dependency-path: services/backend/go.sum
      - name: Check generated OpenAPI
        run: |
          expected=$(sha256sum backend.api.yaml)
          bash scripts/generate-openapi.sh
          test "$expected" = "$(sha256sum backend.api.yaml)"
      - run: go test -race ./... -count=1
      - run: go vet ./...
      - run: go build -o bin/api ./cmd/api
