name: Frontend CI
on:
  workflow_call:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: Install Chromium for portal E2E
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build production frontend image
        working-directory: .
        run: docker build -f services/frontend/Dockerfile --build-arg VITE_API_BASE_URL=/api/v1 -t frontend-ci services/frontend
