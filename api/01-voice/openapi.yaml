openapi: 3.1.0
info:
  title: Голосовой тренажёр — основа системы и голос
  version: 0.1.0
  description: Самостоятельный накопительный контракт этапа до 2026-10-01. Все даты — Unix timestamp в секундах.
    HTTPS, HttpOnly Secure cookies и проверка Origin. Учебные данные и роли задаются преподавателем/admin; самостоятельная
    регистрация создаёт student. Учебная база v0 загружается только одним CSV-файлом карты компетенций; построчного
    CRUD и извлечения данных с помощью LLM нет.
servers:
  - url: /
    description: Текущий сервер
security:
  - accessCookie: []
tags:
  - name: Учебная база
  - name: Голос
  - name: Auth
paths:
  /v1/auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Зарегистрироваться по email и паролю
      description: Создаёт student и сразу возвращает сессию. admin создаётся или назначается вручную в базе. Регистрация,
        вход и обмен токенами в v0 доступны по HTTPS с доверенным сертификатом, включая IP-адреса корпоративной
        сети. Устанавливает access- и refresh-cookies; JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт и первая сессия созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Войти по email и паролю
      description: Создаёт новую независимую сессию. Для неизвестного email и неверного пароля возвращается одинаковый
        INVALID_CREDENTIALS. Роль определяется из текущей записи пользователя. Устанавливает access- и refresh-cookies;
        JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Auth
      summary: Обновить токены текущей сессии
      description: Без тела запроса. Refresh-токен поступает в HttpOnly cookie refresh_token. Успешное обновление
        атомарно заменяет его и устанавливает новый access-токен двумя Set-Cookie. JSON содержит только сроки. Исходный
        срок сессии не продлевается. Старый access-токен действует до своего срока или отзыва сессии. Повторное
        использование старого refresh-токена отзывает всю сессию. Клиент выполняет обновления последовательно; браузер
        сохраняет cookies. Потеря ответа и повтор со старой cookie могут потребовать нового входа. При INVALID_REFRESH_TOKEN
        сервер удаляет обе cookies.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Cookies обновлены; JSON содержит сроки текущей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExpiry'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          description: 'INVALID_REFRESH_TOKEN: cookie отсутствует, токен неизвестен, истёк, отозван или уже использован.
            Обе cookies удаляются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token: Path=/v1/auth; Secure;
                HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Завершить текущую сессию
      description: Без тела запроса. Отзывает сессию по refresh-cookie, включая все её access- и refresh-токены,
        и удаляет обе cookies через Set-Cookie с Max-Age=0 и исходными Path. Другие сессии сохраняются. Если refresh-cookie
        отсутствует, неизвестна, истекла или уже отозвана, возвращает 204 и также удаляет cookies. Access-cookie
        для выхода не требуется; проверка Origin обязательна.
      security: []
      responses:
        '204':
          description: Сессия завершена; токены этой сессии больше не действуют.
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token: Path=/v1/auth; Secure;
                HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
        - $ref: '#/components/parameters/OptionalRefreshCookie'
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Получить текущего пользователя
      description: Возвращает актуальные данные и роль из базы. Изменение роли через SQL применяется при следующем
        запросе, без нового входа. Пароль и refresh-токен не возвращаются.
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/competency-map/import:
    post:
      operationId: importCompetencyMap
      tags:
        - Учебная база
      summary: Заменить учебную базу картой компетенций из CSV
      description: >-
        Требуется роль admin. Принимает ровно один CSV-файл с картой компетенций, ОР, заданиями и критериями.
        Сервер разбирает файл детерминированно, без LLM. Это экспорт таблицы, а не нормализованный обменный
        формат: пустые ячейки объединённых в исходной таблице полей Ком, Сост и ОР наследуют последнее непустое
        значение выше в своей колонке. Задания задаются справа парами колонок Задание N и Критерии N; одна строка
        может содержать несколько таких пар для одного ОР. Критерии — непрозрачный текстовый промпт: API любой
        версии не разбирает и не интерпретирует его, а при оценивании передаёт LLM как есть. При любой ошибке новая
        карта не сохраняется, а действующая база остаётся без изменений.
        Успех атомарно заменяет всю учебную базу. В v0 нет ручек просмотра, добавления, изменения или удаления
        отдельных сущностей.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: >-
                    CSV до 25 МиБ, экспортированный из Excel или Google Sheets: UTF-8 (BOM допускается), корректное
                    экранирование полей двойными кавычками и запятая или точка с запятой как разделитель. Первая
                    непустая строка должна быть строкой
                    заголовков и содержать точные названия Ком, Сост и ОР. После неё допускается ровно одна
                    служебная строка с пояснениями. Набор колонок слева от заданий может включать Тем N, Что должно
                    войти в тест, Уровень ОР, Таксономия, Важность темы и Важность. Каждой непустой колонке
                    Задание N должна соответствовать колонка Критерии N с тем же целым N; пары располагаются справа
                    от карты в любом количестве. Полностью пустые пары игнорируются. Текст критериев не является
                    JSON и сохраняется целиком, включая переводы строк.
              required:
                - file
            encoding:
              file:
                contentType: text/csv
      responses:
        '200':
          description: Учебная база целиком заменена разобранной версией CSV.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompetencyMapImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          description: 'UNSUPPORTED_MEDIA_TYPE: поле file должно содержать CSV.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            CSV_INVALID: недопустимы кодировка, CSV-структура, строка заголовков, служебные строки, колонка
            Задание N без Критерии N (или наоборот), пустые обязательные поля либо значения, которые нельзя
            унаследовать из строки выше. details содержит номер строки (path=row:<номер>) и имя колонки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/voice/transcriptions:
    post:
      operationId: transcribeVoice
      tags:
        - Голос
      summary: Распознать голосовую запись
      description: 'Синхронный запрос: сервер распознаёт аудио, сохраняет расшифровку владельца и возвращает id
        и text в 200. Пока запрос выполняется, интерфейс показывает обработку. При ошибке студент повторяет запись
        или запрос; отдельного job и поллинга нет.'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          description: 'VALIDATION_ERROR: неверные поля; INVALID_AUDIO: запись пуста или повреждена; NO_SPEECH_DETECTED:
            речь не распознана. Можно повторить запись.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Речь распознана; готовая расшифровка сохранена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '502':
          description: 'TRANSCRIPTION_FAILED: сбой сервиса распознавания. Учебный ответ не создан; можно повторить
            запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 'PROCESSING_TIMEOUT: превышено время ожидания распознавания. Клиент может повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV, Ogg/Opus или WebM/Opus, до 25 МиБ.
              required:
                - audio
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/voice/syntheses:
    post:
      operationId: synthesizeQuestion
      tags:
        - Голос
      summary: Озвучить текст вопроса
      description: 'Синхронный запрос: сервер озвучивает текст и возвращает WAV непосредственно в теле 200. Клиент
        проигрывает полученное аудио. Пока запрос выполняется, интерфейс показывает обработку. Параметры модели
        остаются внутри сервиса; job, audio_url и поллинг не используются.'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Озвученный вопрос в WAV.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '502':
          description: 'SYNTHESIS_FAILED: сбой сервиса синтеза. Можно повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 'PROCESSING_TIMEOUT: превышено время ожидания синтеза. Можно повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/; без Domain. Браузер сохраняет через Set-Cookie и отправляет
        автоматически. Сервер проверяет активность сессии и роль в базе.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/v1/auth; без Domain. Одноразовый refresh-токен; заменяется
        через Set-Cookie.
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      description: Непрозрачный идентификатор. Клиент не разбирает его структуру.
    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: Unix timestamp в секундах с 1970-01-01T00:00:00Z. Миллисекунды не используются.
      examples:
        - 1790762400
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
                minLength: 1
            required:
              - code
              - message
      required:
        - code
        - message
      description: code — стабильный машинный код, message — пояснение, details — ошибки отдельных полей или конфигурации
        курса. Учебный вердикт передаётся через Evaluation, а не HTTP-ошибку.
      examples:
        - code: RESOURCE_HAS_CHILDREN
          message: Сначала удалите задания и дочерние ОР.
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: 15–128 символов. Разрешены пробелы и Unicode; пароль не обрезается и не приводится к другому
            регистру. Сервер отклоняет распространённые и скомпрометированные пароли.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - password
      description: Регистрация создаёт только student. Поле role недопустимо. Аккаунт сразу активен; сессия устанавливается
        двумя HttpOnly cookies.
      examples:
        - email: student@example.edu
          password: Example-passphrase-42
          display_name: Иван
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - student
            - admin
          description: admin — преподаватель, имеет доступ ко всем курсам и редактированию каталога. Назначается
            вручную через SQL.
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - email
        - display_name
        - role
        - created_at
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionExpiry'
      required:
        - user
        - session
      examples:
        - user:
            id: user_123
            email: student@example.edu
            display_name: Иван
            role: student
            created_at: 1790762400
          session:
            access_expires_at: 1790763300
            refresh_expires_at: 1793354400
    SessionExpiry:
      type: object
      additionalProperties: false
      properties:
        access_expires_at:
          $ref: '#/components/schemas/Timestamp'
        refresh_expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - access_expires_at
        - refresh_expires_at
      description: Сроки Unix timestamp в секундах; значения токенов находятся только в HttpOnly cookies. Access
        до 15 минут; сессия 30 суток с входа или регистрации. Refresh не продлевает исходный срок сессии.
      examples:
        - access_expires_at: 1790763300
          refresh_expires_at: 1793354400
    SynthesizeRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - text
      description: Текст одного вопроса. 500 символов соответствуют текущему внутреннему VoxCPM2 API.
    Transcription:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          minLength: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - text
        - created_at
      description: Готовая расшифровка, сохранённая сервером и привязанная к текущему пользователю. id используется
        как transcription_id при сдаче ответа. Текст отображается без подтверждения и редактирования. Нет состояния
        обработки или ручки поллинга.
      examples:
        - id: transcription_1
          text: Дробь обозначает часть целого.
          created_at: 1790762403
    CompetencyMapImport:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
          description: Последовательный номер целиком заменённой версии учебной базы.
        imported_at:
          $ref: '#/components/schemas/Timestamp'
        competency_count:
          type: integer
          minimum: 1
        constituent_count:
          type: integer
          minimum: 1
        outcome_count:
          type: integer
          minimum: 1
        task_count:
          type: integer
          minimum: 1
      required:
        - revision
        - imported_at
        - competency_count
        - constituent_count
        - outcome_count
        - task_count
      description: >-
        Итог импорта. Импортёр наследует значения Ком, Сост и ОР вниз по колонке, чтобы корректно обработать
        пустые ячейки, появившиеся при выгрузке объединённых ячеек из Excel или Google Sheets. Каждая заполненная
        пара Задание N и Критерии N создаёт одно задание привязанного ОР. Критерии N — одно непустое непрозрачное
        текстовое поле: его содержание не разбирается, а при оценивании передаётся LLM как есть. Другие колонки карты
        сохраняются как атрибуты компетенции, составляющей, ОР или темы согласно их заголовку.
      examples:
        - revision: 1
          imported_at: 1790762400
          competency_count: 1
          constituent_count: 1
          outcome_count: 6
          task_count: 18
  responses:
    Forbidden:
      description: 'FORBIDDEN: операция доступна только пользователю с ролью admin.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'UNAUTHORIZED: access-токен отсутствует, недействителен, истёк или относится к отозванной сессии.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не существует, не опубликован или недоступен текущему пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'CONFLICT: операция несовместима с текущим состоянием ресурса (расшифровка уже использована,
        задание не активно или уже оценено, диагностика ещё не завершена, недостаточный пул заданий).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Неверные поля запроса либо неполная конфигурация курса. details содержит конкретные нарушения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'UPLOAD_TOO_LARGE: файл превышает 25 МиБ.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'UNSUPPORTED_AUDIO_FORMAT: контейнер или кодек записи не поддерживается.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'PROCESSING_UNAVAILABLE: модель или обработчик недоступны. Для синхронного голоса успешный результат
        не получен; можно повторить запрос. Для принятых ответов ошибка оценивания отражается в сохранённом Answer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmailAlreadyRegistered:
      description: 'EMAIL_ALREADY_REGISTERED: нормализованный email уже занят.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 'INVALID_CREDENTIALS: email или пароль неверен. Одинаковое сообщение независимо от причины.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthValidationError:
      description: 'VALIDATION_ERROR: некорректные поля; PASSWORD_TOO_WEAK: пароль не соответствует политике. details
        указывает поля.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'RATE_LIMITED: превышена частота запросов.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
    CsrfRejected:
      description: 'CSRF_ORIGIN_DENIED: Origin отсутствует, равен null или не входит в разрешённый список; операция
        не выполняется.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TrustedOrigin:
      name: Origin
      in: header
      required: true
      description: Origin frontend, например https://10.10.0.20:5173. Браузер устанавливает автоматически. Сервер
        проверяет точное совпадение схемы, хоста и порта с настроенным списком. Отсутствующий, null или чужой Origin
        возвращает 403 CSRF_ORIGIN_DENIED до выполнения операции.
      schema:
        type: string
        format: uri
    OptionalRefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: Браузер отправляет автоматически. При отсутствии cookie logout всё равно удаляет обе cookies
        и возвращает 204.
      schema:
        type: string
