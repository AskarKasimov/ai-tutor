openapi: 3.1.0
info:
  title: Голосовой тренажёр — демонстрация MVP
  version: 0.4.0
  description: Самостоятельный накопительный контракт этапа до 2026-10-14. Все даты — Unix timestamp в секундах.
    HTTPS и HttpOnly Secure cookies. Учебные данные и роли задаются преподавателем/admin; самостоятельная
    регистрация создаёт student.
servers:
  - url: /
    description: Текущий сервер
security:
  - accessCookie: []
tags:
  - name: Учебная база
  - name: Сессия
  - name: Грейдинг и фидбэк
  - name: Голос
  - name: Auth
paths:
  /v1/auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Зарегистрироваться по email и паролю
      description: Создаёт student и сразу возвращает сессию. admin создаётся или назначается вручную в базе. Регистрация,
        вход и обмен токенами в v0 доступны по HTTPS с доверенным сертификатом, включая IP-адреса корпоративной
        сети. Устанавливает access- и refresh-cookies; JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт и первая сессия созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/login:
    post:
      operationId: login
      tags:
        - Auth
      summary: Войти по email и паролю
      description: Создаёт новую независимую сессию. Для неизвестного email и неверного пароля возвращается одинаковый
        INVALID_CREDENTIALS. Роль определяется из текущей записи пользователя. Устанавливает access- и refresh-cookies;
        JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Auth
      summary: Обновить токены текущей сессии
      description: Без тела запроса. Refresh-токен поступает в HttpOnly cookie refresh_token. Успешное обновление
        атомарно заменяет его и устанавливает новый access-токен двумя Set-Cookie. JSON содержит только сроки. Исходный
        срок сессии не продлевается. Старый access-токен действует до своего срока или отзыва сессии. Повторное
        использование старого refresh-токена отзывает всю сессию. Клиент выполняет обновления последовательно; браузер
        сохраняет cookies. Потеря ответа и повтор со старой cookie могут потребовать нового входа. При INVALID_REFRESH_TOKEN
        сервер удаляет обе cookies.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Cookies обновлены; JSON содержит сроки текущей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExpiry'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          description: 'INVALID_REFRESH_TOKEN: cookie отсутствует, токен неизвестен, истёк, отозван или уже использован.
            Обе cookies удаляются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token: Path=/v1/auth; Secure;
                HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      summary: Завершить текущую сессию
      description: Без тела запроса. Отзывает сессию по refresh-cookie, включая все её access- и refresh-токены,
        и удаляет обе cookies через Set-Cookie с Max-Age=0 и исходными Path. Другие сессии сохраняются. Если refresh-cookie
        отсутствует, неизвестна, истекла или уже отозвана, возвращает 204 и также удаляет cookies. Access-cookie
        для выхода не требуется.
      security: []
      responses:
        '204':
          description: Сессия завершена; токены этой сессии больше не действуют.
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token: Path=/v1/auth; Secure;
                HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
        - $ref: '#/components/parameters/OptionalRefreshCookie'
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      summary: Получить текущего пользователя
      description: Возвращает актуальные данные и роль из базы. Изменение роли через SQL применяется при следующем
        запросе, без нового входа. Пароль и refresh-токен не возвращаются.
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/voice/transcriptions:
    post:
      operationId: transcribeVoice
      tags:
        - Голос
      summary: Распознать голосовую запись
      description: 'Синхронный запрос: сервер распознаёт аудио, сохраняет расшифровку владельца и возвращает id
        и text в 200. Пока запрос выполняется, интерфейс показывает обработку. При ошибке студент повторяет запись
        или запрос; отдельного job и поллинга нет.'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/Unavailable'
        '422':
          description: 'VALIDATION_ERROR: неверные поля; INVALID_AUDIO: запись пуста или повреждена; NO_SPEECH_DETECTED:
            речь не распознана. Можно повторить запись.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: Речь распознана; готовая расшифровка сохранена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcription'
        '502':
          description: 'TRANSCRIPTION_FAILED: сбой сервиса распознавания. Учебный ответ не создан; можно повторить
            запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 'PROCESSING_TIMEOUT: превышено время ожидания распознавания. Клиент может повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                audio:
                  type: string
                  format: binary
                  description: WAV, Ogg/Opus или WebM/Opus, до 25 МиБ.
              required:
                - audio
  /v1/voice/syntheses:
    post:
      operationId: synthesizeQuestion
      tags:
        - Голос
      summary: Озвучить текст вопроса
      description: 'Синхронный запрос: сервер озвучивает текст и возвращает WAV непосредственно в теле 200. Клиент
        проигрывает полученное аудио. Пока запрос выполняется, интерфейс показывает обработку. Параметры модели
        остаются внутри сервиса; job, audio_url и поллинг не используются.'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '200':
          description: Озвученный вопрос в WAV.
          content:
            audio/wav:
              schema:
                type: string
                format: binary
        '502':
          description: 'SYNTHESIS_FAILED: сбой сервиса синтеза. Можно повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '504':
          description: 'PROCESSING_TIMEOUT: превышено время ожидания синтеза. Можно повторить запрос.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeRequest'
  /v1/courses:
    get:
      operationId: listPublishedCourses
      tags:
        - Учебная база
      summary: Список опубликованных курсов
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPublishedCourse
      tags:
        - Учебная база
      summary: Опубликованный курс и составляющие РПД
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/courses:
    get:
      operationId: listManagedCourses
      tags:
        - Учебная база
      summary: Все курсы, доступные admin (преподавателю)
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
    post:
      operationId: createCourse
      tags:
        - Учебная база
      summary: Создать черновик курса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/admin/courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getCourseDraft
      tags:
        - Учебная база
      summary: Черновик курса со всеми записями для формы
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Составляющие, ОР
        и задания представлены плоскими массивами; дерево строится по parent_outcome_id.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateCourse
      tags:
        - Учебная база
      summary: Изменить сведения о курсе
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/admin/courses/{courseId}/publish:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: publishCourse
      tags:
        - Учебная база
      summary: Проверить и опубликовать черновик курса
      description: Требуется admin. Проверяет составляющие РПД, дерево ОР, разметку заданий, положительный max_score
        и рубрики. ОР и тема — одна сущность. Каждый main содержит ровно два разных basic_outcome_ids, принадлежащих
        дочерним ОР его основного ОР в той же составляющей; по каждому базовому ОР есть готовое basic-задание. Материалы
        успешно индексированы. Публикует неизменяемый снимок; правки черновика не меняют опубликованные ответы.
        Для каждого ОР с diagnostic_eligible=true требуется минимум 7 разных main-заданий этого ОР и готовые базовые
        ветки. По всем проверяемым ОР требуется тренировочный пул. Нехватка диагностических или базовых заданий
        — 422; конечный тренировочный пул может исчерпаться и даёт tasks_exhausted.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/courses/{courseId}/constituents:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: createConstituent
      tags:
        - Учебная база
      summary: Добавить составляющую РПД
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstituentInput'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Constituent'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/admin/constituents/{constituentId}:
    parameters:
      - name: constituentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      operationId: updateConstituent
      tags:
        - Учебная база
      summary: Изменить составляющую РПД
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstituentPatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Constituent'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
    delete:
      operationId: deleteConstituent
      tags:
        - Учебная база
      summary: Удалить составляющую из черновика
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Удаление разрешено
        только после удаления всех ОР составляющей. Опубликованные снимки и результаты студентов сохраняются.
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/constituents/{constituentId}/outcomes:
    parameters:
      - name: constituentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: createOutcome
      tags:
        - Учебная база
      summary: Добавить ОР в дерево составляющей
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomeInput'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outcome'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/admin/outcomes/{outcomeId}:
    parameters:
      - name: outcomeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      operationId: updateOutcome
      tags:
        - Учебная база
      summary: Изменить ОР и его место в дереве
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutcomePatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Outcome'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. parent_outcome_id=null
        делает ОР корневым. Родитель должен принадлежать той же составляющей. Циклы запрещены; ошибка связи возвращает
        422.
    delete:
      operationId: deleteOutcome
      tags:
        - Учебная база
      summary: Удалить ОР из черновика
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. ОР с дочерними ОР
        или заданиями удалить нельзя. Опубликованные версии и результаты студентов сохраняются.
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/admin/outcomes/{outcomeId}/tasks:
