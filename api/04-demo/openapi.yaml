  /v1/admin/courses/{courseId}/materials:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: uploadMaterial
      tags:
        - Учебная база
      summary: Загрузить РПД, карту компетенций или учебный материал
      description: Требуется admin (преподаватель). Файл сохраняется и индексируется для поиска фрагментов. Поддерживаются
        PDF, DOCX, TXT, CSV и XLSX; до 25 МиБ. Не заменяет поштучный ввод заданий и рубрик через форму.
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: Материал курса, до 25 МиБ.
                kind:
                  type: string
                  enum:
                    - rpd
                    - competency_map
                    - learning_material
              required:
                - file
                - kind
  /v1/admin/materials/{materialId}:
    parameters:
      - name: materialId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMaterial
      tags:
        - Учебная база
      summary: Проверить сохранение и индексирование материала
      description: 'Требуется admin (преподаватель). '
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Material'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      operationId: deleteMaterial
      tags:
        - Учебная база
      summary: Удалить материал из черновика
      description: 'Требуется admin (преподаватель). '
      responses:
        '204':
          description: Операция выполнена
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/sessions:
    get:
      operationId: listMySessions
      tags:
        - Сессия
      summary: Восстановить историю учебных сессий
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
        - name: phase
          in: query
          required: false
          schema:
            type: string
            enum:
              - diagnostic
              - diagnostic_feedback
              - training
              - completed
    post:
      operationId: createSession
      tags:
        - Сессия
      summary: Начать диагностику выбранного ОР (темы)
      description: Выбирает без повторов 7 готовых main-заданий выбранного outcome_id из опубликованного пула преподавателя.
        ОР должен принадлежать course_id и иметь diagnostic_eligible=true; неизвестный или неопубликованный ОР —
        404, несовпадение курса или запрет диагностики — 422, недостаточный пул — 409. Фиксирует версию курса; один
        id сохраняется до конца тренировки.
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSession'
  /v1/sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMySession
      tags:
        - Сессия
      summary: Получить текущий этап, задания и результаты сессии
      description: Только владелец. Возвращает актуальный current_assignment_id и все сохранённые ответы по ссылкам
        answer_id. Повторное чтение не выдаёт новых заданий.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/sessions/{sessionId}/training:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: startTraining
      tags:
        - Сессия
      summary: Перейти от итогов диагностики к тренировке
      description: Без тела. Разрешено после diagnostic_feedback. На каждый неподтверждённый ОР выбирает 2 разных
        usage=training задания именно этого неподтверждённого ОР в том же опубликованном курсе, которые не использовались
        в этой сессии. Набор фиксируется. Если доступно меньше двух, назначает доступные задания; итог после их
        выполнения — tasks_exhausted. Если заданий совсем нет, сразу completed/tasks_exhausted. Повторный вызов
        после начала или завершения тренировки возвращает существующий результат без новой выдачи. При вызове во
        время диагностики — 409.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /v1/assignments/{assignmentId}/answer:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: submitAssignmentAnswer
      tags:
        - Грейдинг и фидбэк
      summary: Сдать голосовой ответ на текущее задание сессии
      description: 'Только текущее задание и сохранённая расшифровка владельца. После оценки сервер атомарно сохраняет
        результат и назначает следующий шаг; partial или incorrect main добавляет два basic, basic не запускает
        новую ветку. Оценка ответа доступна сразу. Нельзя отправить ответ на ещё не активное или уже оценённое задание:
        409. Чужая или неизвестная расшифровка — 404; использованная для другого ответа — 409.'
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
    get:
      operationId: getAssignmentAnswer
      tags:
        - Грейдинг и фидбэк
      summary: Получить сохранённый ответ и оценку выданного задания
      description: ''
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/; без Domain. Браузер сохраняет через Set-Cookie и отправляет
        автоматически. Сервер проверяет активность сессии и роль в базе.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/v1/auth; без Domain. Одноразовый refresh-токен; заменяется
        через Set-Cookie.
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      description: Непрозрачный идентификатор. Клиент не разбирает его структуру.
    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: Unix timestamp в секундах с 1970-01-01T00:00:00Z. Миллисекунды не используются.
      examples:
        - 1790762400
    CourseInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
      required:
        - title
    CoursePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
      minProperties: 1
    ConstituentInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      required:
        - title
        - position
    ConstituentPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      minProperties: 1
    Constituent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      required:
        - id
        - course_id
        - title
        - position
    OutcomeInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Разрешить выбор этого ОР (темы) для диагностики из пула преподавателя.
      required:
        - title
        - parent_outcome_id
    OutcomePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Разрешить выбор этого ОР (темы) для диагностики из пула преподавателя.
      minProperties: 1
    Outcome:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        constituent_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Включить ОР в случайный диагностический пул преподавателя.
      required:
        - id
        - constituent_id
        - title
        - parent_outcome_id
        - diagnostic_eligible
      description: Образовательный результат (ОР) — тема курса. Принадлежит составляющей РПД, может иметь дочерние
        ОР и несколько заданий. Отдельной сущности темы нет.
    Criterion:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          description: Уникальный внутри задания ключ критерия.
        description:
          type: string
          minLength: 1
      required:
        - key
        - description
    Rubric:
      type: object
      additionalProperties: false
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
          minItems: 1
        verdict_rule:
          type: string
          minLength: 1
          description: Правило преподавателя для correct/partial/incorrect, числового балла от 0 до max_score и
            подтверждения проверяемого ОР. Основной неверный или частично верный ответ вызывает два базовых задания
            в диагностике.
      required:
        - criteria
        - verdict_rule
      description: Ключи критериев должны быть уникальны. LLM обязана проверить каждый критерий и применить verdict_rule;
        сервер проверяет структуру результата, но не переопределяет учебный вердикт.
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - main
            - basic
            - training
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
        max_score:
          type: number
          exclusiveMinimum: 0
        rubric:
          $ref: '#/components/schemas/Rubric'
        reference_answer:
          type:
            - string
            - 'null'
        basic_outcome_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
          description: Для main ровно два базовых ОР, заданных преподавателем; для basic/training пустой массив.
      required:
        - prompt
        - usage
        - difficulty
        - max_score
        - rubric
        - basic_outcome_ids
      allOf:
        - if:
            properties:
              usage:
                const: main
          then:
            properties:
              basic_outcome_ids:
                minItems: 2
                maxItems: 2
          else:
            properties:
              basic_outcome_ids:
                maxItems: 0
      description: Задание одного ОР; ОР задаётся outcomeId в пути создания. Один ОР может содержать несколько заданий.
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - main
            - basic
            - training
        difficulty:
          type: string
