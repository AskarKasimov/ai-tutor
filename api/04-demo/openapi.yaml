        - Грейдинг и фидбэк
      summary: Оценить один голосовой ответ вне сессии
      description: Сохранённая расшифровка должна принадлежать студенту и ещё не быть использована для другого ответа;
        чужая или неизвестная — 404, уже использованная — 409. Проверка использует зафиксированную опубликованную
        версию задания и материалов.
      responses:
        '202':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswer'
  /v1/answers/{answerId}:
