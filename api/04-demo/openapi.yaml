                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/admin/tasks/{taskId}:
    parameters:
      - name: taskId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    patch:
      operationId: updateTask
      tags:
        - Учебная база
      summary: Изменить задание или критерии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Переданный rubric
        полностью заменяет критерии и правило вердикта в черновике. Опубликованная версия и критерии уже выданных
        заданий остаются прежними.
    delete:
      operationId: deleteTask
      tags:
        - Учебная база
      summary: Удалить задание из черновика
      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
  /v1/courses/{courseId}/outcomes:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: listCourseOutcomes
      tags:
        - Учебная база
      summary: Образовательные результаты (темы) опубликованного курса
      description: Возвращает ОР курса с составляющими и связями дерева. Для диагностики выбираются ОР с diagnostic_eligible=true.
        Критерии и эталонные ответы не раскрываются.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutcomeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/outcomes/{outcomeId}/tasks:
    parameters:
      - name: outcomeId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: listOutcomeTasks
      tags:
        - Учебная база
      summary: Готовые основные задания выбранного ОР (темы)
      description: Возвращает usage=main задания, принадлежащие выбранному ОР. У одного ОР может быть несколько
        заданий. Критерии и эталонный ответ студенту не раскрываются.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/tasks/{taskId}/answers:
    parameters:
      - name: taskId
