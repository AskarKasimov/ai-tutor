    SessionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      required:
        - items
    SynthesizeRequest:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - text
      description: Текст одного вопроса. 500 символов соответствуют текущему внутреннему VoxCPM2 API.
    Material:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        kind:
          type: string
          enum:
            - rpd
            - competency_map
            - learning_material
        filename:
          type: string
        status:
          type: string
          enum:
            - processing
            - ready
            - failed
        failure:
          oneOf:
            - $ref: '#/components/schemas/MaterialFailure'
            - type: 'null'
      required:
        - id
        - course_id
        - kind
        - filename
        - status
        - failure
    TaskPreview:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        outcome_id:
          $ref: '#/components/schemas/Id'
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - main
            - basic
            - training
        difficulty:
          type: string
          enum:
            - easy
            - medium
            - hard
      required:
        - id
        - outcome_id
        - prompt
        - usage
        - difficulty
    TaskList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TaskPreview'
      required:
        - items
    SubmitAnswer:
      type: object
      additionalProperties: false
      properties:
        transcription_id:
          $ref: '#/components/schemas/Id'
      required:
        - transcription_id
      description: Ссылка transcription_id на сохранённую расшифровку текущего студента, полученную синхронным POST
        /v1/voice/transcriptions. Исходный текст берётся сервером; клиент не передаёт исправленную расшифровку.
    Evidence:
      type: object
      additionalProperties: false
      properties:
        material_id:
          $ref: '#/components/schemas/Id'
        excerpt:
          type: string
          minLength: 1
      required:
        - material_id
        - excerpt
    MaterialFailure:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - INVALID_MATERIAL
            - INDEXING_FAILED
        message:
          type: string
          minLength: 1
      required:
        - code
        - message
    DiagnosticSummary:
      type: object
      additionalProperties: false
      properties:
        score:
          type: number
          minimum: 0
        max_score:
          type: number
          exclusiveMinimum: 0
        unconfirmed_outcome_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          uniqueItems: true
        feedback:
          type: string
          minLength: 1
      required:
        - score
        - max_score
        - unconfirmed_outcome_ids
        - feedback
      description: score и max_score суммируются только по семи main. Базовые задания уточняют пробелы, но не входят
        в диагностический балл. После завершения диагностики summary неизменяем, включая исходный список пробелов.
        В список пробелов входит каждый проверенный main/basic ОР, для которого хотя бы один ответ имеет outcome_confirmed=false;
        дубликаты удаляются. Непроверенные ОР не объявляются пробелами.
    TrainingSummary:
      type: object
      additionalProperties: false
      properties:
        target_count:
          type: integer
          minimum: 0
        assigned_count:
          type: integer
          minimum: 0
        answered_count:
          type: integer
          minimum: 0
        score:
          type: number
          minimum: 0
        max_score:
          type: number
          minimum: 0
        feedback:
          type: string
          minLength: 1
      required:
        - target_count
        - assigned_count
        - answered_count
        - score
        - max_score
        - feedback
      description: Отдельный результат тренировочных ответов; не меняет diagnostic_summary. target_count = 2 * число
        неподтверждённых ОР. assigned_count меньше target_count только при исчерпании подходящих неиспользованных
        заданий.
    Transcription:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        text:
          type: string
          minLength: 1
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - text
        - created_at
      description: Готовая расшифровка, сохранённая сервером и привязанная к текущему пользователю. id используется
        как transcription_id при сдаче ответа. Текст отображается без подтверждения и редактирования. Нет состояния
        обработки или ручки поллинга.
      examples:
        - id: transcription_1
          text: Дробь обозначает часть целого.
          created_at: 1790762403
    OutcomeList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
      required:
        - items
  responses:
    Unauthorized:
      description: 'UNAUTHORIZED: access-токен отсутствует, недействителен, истёк или относится к отозванной сессии.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'FORBIDDEN: требуется admin (преподаватель).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не существует, не опубликован или недоступен текущему пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'CONFLICT: операция несовместима с текущим состоянием ресурса (расшифровка уже использована,
        задание не активно или уже оценено, диагностика ещё не завершена, недостаточный пул заданий).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Неверные поля запроса либо неполная конфигурация курса. details содержит конкретные нарушения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'UPLOAD_TOO_LARGE: файл превышает 25 МиБ.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'UNSUPPORTED_AUDIO_FORMAT: контейнер или кодек записи не поддерживается.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'PROCESSING_UNAVAILABLE: модель или обработчик недоступны. Для синхронного голоса успешный результат
        не получен; можно повторить запрос. Для принятых ответов ошибка оценивания отражается в сохранённом Answer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmailAlreadyRegistered:
      description: 'EMAIL_ALREADY_REGISTERED: нормализованный email уже занят.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 'INVALID_CREDENTIALS: email или пароль неверен. Одинаковое сообщение независимо от причины.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthValidationError:
      description: 'VALIDATION_ERROR: некорректные поля; PASSWORD_TOO_WEAK: пароль не соответствует политике. details
        указывает поля.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'RATE_LIMITED: превышена частота запросов.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
  parameters:
    OptionalRefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: Браузер отправляет автоматически. При отсутствии cookie logout всё равно удаляет обе cookies
        и возвращает 204.
      schema:
        type: string
