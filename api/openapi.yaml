components:
  schemas:
    app.HealthResponse:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    assessmenthttp.EvaluateRequest:
      additionalProperties: false
      properties:
        correct_answer:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        question:
          type: string
        transcription_id:
          type: string
        voice_instruction:
          type: string
      required:
        - question
        - transcription_id
        - voice_instruction
      type: object
    assessmenthttp.EvaluateResponse:
      additionalProperties: false
      properties:
        feedback:
          items:
            type: string
          type: array
          uniqueItems: false
        score:
          maximum: 2
          minimum: 0
          type: integer
      required:
        - feedback
        - score
      type: object
    authhttp.LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    authhttp.RegisterRequest:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 200
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 15
          type: string
      required:
        - email
        - password
      type: object
    authhttp.authSession:
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/authhttp.wireExpiry'
        user:
          $ref: '#/components/schemas/authhttp.wireUser'
      required:
        - session
        - user
      type: object
    authhttp.wireExpiry:
      additionalProperties: false
      properties:
        access_expires_at:
          type: integer
        refresh_expires_at:
          type: integer
      required:
        - access_expires_at
        - refresh_expires_at
      type: object
    authhttp.wireUser:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/user.Role'
      required:
        - created_at
        - display_name
        - email
        - id
        - role
      type: object
    competencyhttp.Competency:
      additionalProperties: false
      properties:
        constituents:
          items:
            $ref: '#/components/schemas/competencyhttp.Constituent'
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          type: string
      required:
        - constituents
        - id
        - name
      type: object
    competencyhttp.Constituent:
      additionalProperties: false
      properties:
        curriculum_sections:
          items:
            $ref: '#/components/schemas/competencyhttp.CurriculumSection'
          type: array
          uniqueItems: false
        id:
          type: string
        name:
          type: string
        outcomes:
          items:
            $ref: '#/components/schemas/competencyhttp.Outcome'
          type: array
          uniqueItems: false
        topic_level_code:
          type:
            - string
            - "null"
      required:
        - curriculum_sections
        - id
        - name
        - outcomes
        - topic_level_code
      type: object
    competencyhttp.CurriculumSection:
      additionalProperties: false
      properties:
        code:
          type: string
        curriculum_competencies:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
        - code
        - curriculum_competencies
        - title
      type: object
    competencyhttp.ImportResult:
      additionalProperties: false
      properties:
        competency_count:
          type: integer
        constituent_count:
          type: integer
        imported_at:
          type: integer
        outcome_count:
          type: integer
        revision:
          type: integer
        task_count:
          type: integer
        unparsed_task_cell_count:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/competencyhttp.ImportWarning'
          type: array
          uniqueItems: false
      required:
        - competency_count
        - constituent_count
        - imported_at
        - outcome_count
        - revision
        - task_count
        - unparsed_task_cell_count
        - warnings
      type: object
    competencyhttp.ImportWarning:
      additionalProperties: false
      properties:
        code:
          type: string
        column:
          type: string
        column_index:
          type: integer
        row:
          type: integer
      required:
        - code
        - column
        - column_index
        - row
      type: object
    competencyhttp.MapSnapshot:
      additionalProperties: false
      properties:
        competencies:
          items:
            $ref: '#/components/schemas/competencyhttp.Competency'
          type: array
          uniqueItems: false
        imported_at:
          type:
            - integer
            - "null"
        revision:
          type: integer
      required:
        - competencies
        - imported_at
        - revision
      type: object
    competencyhttp.Outcome:
      additionalProperties: false
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        educational_content:
          type:
            - string
            - "null"
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        name:
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/competencyhttp.Task'
          type: array
          uniqueItems: false
        taxonomy_code:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - educational_content
        - id
        - importance
        - include_in_test
        - name
        - tasks
        - taxonomy_code
      type: object
    competencyhttp.Task:
      additionalProperties: false
      properties:
        id:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        question:
          type: string
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - id
        - options
        - origin
        - question
        - voice_instruction
      type: object
    fault.Detail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - code
        - message
      type: object
    fault.Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/fault.Detail'
          type: array
          uniqueItems: false
        message:
          type: string
      required:
        - code
        - message
      type: object
    taskbankhttp.CurriculumSection:
      additionalProperties: false
      properties:
        code:
          type: string
        curriculum_competencies:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
        - code
        - curriculum_competencies
        - title
      type: object
    taskbankhttp.TaskProfile:
      additionalProperties: false
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        competency_id:
          type: string
        competency_name:
          type: string
        constituent_id:
          type: string
        constituent_name:
          type: string
        curriculum_sections:
          items:
            $ref: '#/components/schemas/taskbankhttp.CurriculumSection'
          type: array
          uniqueItems: false
        educational_content:
          type:
            - string
            - "null"
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        outcome_name:
          type: string
        question:
          type: string
        taxonomy_code:
          type:
            - string
            - "null"
        topic_level_code:
          type:
            - string
            - "null"
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - competency_id
        - competency_name
        - constituent_id
        - constituent_name
        - curriculum_sections
        - educational_content
        - id
        - importance
        - include_in_test
        - options
        - origin
        - outcome_id
        - outcome_name
        - question
        - taxonomy_code
        - topic_level_code
        - voice_instruction
      type: object
    taskbankhttp.TaskSummary:
      additionalProperties: false
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        competency_name:
          type: string
        constituent_name:
          type: string
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        outcome_name:
          type: string
        question:
          type: string
        taxonomy_code:
          type:
            - string
            - "null"
        topic_level_code:
          type:
            - string
            - "null"
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - competency_name
        - constituent_name
        - id
        - importance
        - include_in_test
        - options
        - origin
        - outcome_id
        - outcome_name
        - question
        - taxonomy_code
        - topic_level_code
        - voice_instruction
      type: object
    taskgenhttp.GenerateRequest:
      additionalProperties: false
      properties:
        outcome_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - outcome_id
      type: object
    taskgenhttp.GeneratedTask:
      additionalProperties: false
      properties:
        id:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        question:
          type: string
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - id
        - options
        - origin
        - outcome_id
        - question
        - voice_instruction
      type: object
    taskgenhttp.ImportMaterialRequest:
      additionalProperties: false
      properties:
        content:
          type: string
        name:
          type: string
        outcome_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
        - content
        - name
        - outcome_ids
      type: object
    user.Role:
      enum:
        - student
        - admin
      type: string
      x-enum-varnames:
        - Student
        - Admin
    variantgenhttp.CompetencyBlock:
      additionalProperties: false
      description: 'Main и два basic принадлежат трём разным TRUE-ОР одной компетенции. Main: максимум Bloom+importance, ничья по большей importance, затем порядок карты. Проектная детализация basic: Bloom ASC, importance DESC, источник; строгий нижний ранг не требуется.'
      properties:
        basic:
          items:
            $ref: '#/components/schemas/variantgenhttp.VariantTask'
          maxItems: 2
          minItems: 2
          type: array
        competency_id:
          maxLength: 128
          minLength: 1
          type: string
        competency_name:
          type: string
        main:
          $ref: '#/components/schemas/variantgenhttp.VariantTask'
        position:
          format: int64
          minimum: 1
          type: integer
      required:
        - competency_id
        - competency_name
        - position
        - main
        - basic
      type: object
    variantgenhttp.SkippedCompetency:
      additionalProperties: false
      description: 'Компетенция пропущена: меньше трёх разных ОР с TRUE, допустимыми метаданными и готовыми задачами. Аналоги одного ОР не увеличивают eligible_outcome_count.'
      properties:
        code:
          enum:
            - INSUFFICIENT_DISTINCT_OUTCOMES
          type: string
        competency_id:
          maxLength: 128
          minLength: 1
          type: string
        competency_name:
          type: string
        eligible_outcome_count:
          maximum: 2
          minimum: 0
          type: integer
        message:
          type: string
      required:
        - competency_id
        - competency_name
        - eligible_outcome_count
        - code
        - message
      type: object
    variantgenhttp.Variant:
      additionalProperties: false
      description: Сохранённый вариант всей активной карты после фильтра, без выбора темы. Нет seed, состояния сессии, ответов и оценок. Все позиции main/basic доступны как план; показ basic регулирует другой модуль. Повторное чтение не выбирает новые аналоги.
      properties:
        algorithm_version:
          maxLength: 128
          minLength: 1
          type: string
        competencies:
          items:
            $ref: '#/components/schemas/variantgenhttp.CompetencyBlock'
          minItems: 1
          type: array
        created_at:
          format: int64
          minimum: 0
          type: integer
        id:
          maxLength: 128
          minLength: 1
          type: string
        included_competency_count:
          format: int64
          minimum: 1
          type: integer
        map_revision:
          format: int64
          minimum: 1
          type: integer
        skipped_competencies:
          items:
            $ref: '#/components/schemas/variantgenhttp.SkippedCompetency'
          type: array
        skipped_competency_count:
          format: int64
          minimum: 0
          type: integer
        task_count:
          format: int64
          minimum: 3
          type: integer
      required:
        - id
        - map_revision
        - algorithm_version
        - included_competency_count
        - skipped_competency_count
        - task_count
        - created_at
        - competencies
        - skipped_competencies
      type: object
    variantgenhttp.VariantList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/variantgenhttp.VariantSummary'
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    variantgenhttp.VariantSummary:
      additionalProperties: false
      description: Метаданные сохранённого варианта. task_count = 3 × included_competency_count.
      properties:
        algorithm_version:
          maxLength: 128
          minLength: 1
          type: string
        created_at:
          format: int64
          minimum: 0
          type: integer
        id:
          maxLength: 128
          minLength: 1
          type: string
        included_competency_count:
          format: int64
          minimum: 1
          type: integer
        map_revision:
          format: int64
          minimum: 1
          type: integer
        skipped_competency_count:
          format: int64
          minimum: 0
          type: integer
        task_count:
          format: int64
          minimum: 3
          type: integer
      required:
        - id
        - map_revision
        - algorithm_version
        - included_competency_count
        - skipped_competency_count
        - task_count
        - created_at
      type: object
    variantgenhttp.VariantTask:
      additionalProperties: false
      description: Сохранённая позиция плана, не ответ или факт предъявления студенту. id — variant-local ID для интеграции грейдинга. Исходные ID и текст читаются из снимка после переимпорта. Эталон/criteria доступны серверному reader, в публичный DTO не входят. Публичный DTO также скрывает ОС и сырой JSON снимка.
      properties:
        competency_id:
          maxLength: 128
          minLength: 1
          type: string
        competency_name:
          type: string
        constituent_id:
          maxLength: 128
          minLength: 1
          type: string
        constituent_name:
          type: string
        id:
          maxLength: 128
          minLength: 1
          type: string
        importance:
          maximum: 5
          minimum: 1
          type: integer
        include_in_test:
          const: true
          type: boolean
        options:
          items:
            type: string
          type: array
        origin:
          enum:
            - authored
            - ai_generated
          type: string
        outcome_id:
          maxLength: 128
          minLength: 1
          type: string
        outcome_name:
          type: string
        question:
          minLength: 1
          type: string
        role:
          enum:
            - main
            - basic
          type: string
        source_task_id:
          maxLength: 128
          minLength: 1
          type: string
        taxonomy_code:
          enum:
            - knowledge
            - understanding
            - application
            - analysis
          type: string
        voice_instruction:
          minLength: 1
          type: string
      required:
        - id
        - source_task_id
        - competency_id
        - competency_name
        - constituent_id
        - constituent_name
        - outcome_id
        - outcome_name
        - role
        - taxonomy_code
        - importance
        - include_in_test
        - question
        - options
        - voice_instruction
        - origin
      type: object
    voicehttp.SynthesizeRequest:
      additionalProperties: false
      properties:
        text:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - text
      type: object
    voicehttp.Transcription:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - text
      type: object
  securitySchemes:
    accessCookie:
      in: cookie
      name: access_token
      type: apiKey
    refreshCookie:
      in: cookie
      name: refresh_token
      type: apiKey
info:
  description: 'Единый API: действующие auth/voice/map/catalog/assessment/taskgen и проект variantgen для ревью. x-implementation: implemented — работает, planned — ещё не реализовано. Variantgen собирает, сохраняет и читает варианты; грейдинг, ответы и тренировка — работа другого разработчика. Источник — текущий ML CSV/XLSX. Даты — Unix seconds; cookies Secure/HttpOnly.'
  title: AI Tutor Backend API
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/competency-map/import:
    post:
      description: Доступно только admin. Импорт атомарно заменяет учебную базу.
      operationId: importCompetencyMap
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  description: Карта компетенций CSV или XLSX, до 25 МиБ
                  format: binary
                  type: string
              required:
                - file
              type: object
        description: Карта компетенций CSV или XLSX, до 25 МиБ
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/competencyhttp.ImportResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Заменить учебную базу картой компетенций
      tags:
        - Учебная база
      x-implementation: implemented
  /admin/materials:
    post:
      operationId: importMaterial
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taskgenhttp.ImportMaterialRequest'
              description: Текст и связи материала
              summary: request
        description: Текст и связи материала
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Загрузить учебный материал в контекст RAG
      tags:
        - Учебная база
      x-implementation: implemented
  /assessments/evaluate:
    post:
      description: Принимает произвольное задание и ID принадлежащей студенту расшифровки. Оценка не сохраняется.
      operationId: evaluateAnswer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assessmenthttp.EvaluateRequest'
              description: Задание и расшифровка
              summary: request
        description: Задание и расшифровка
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/assessmenthttp.EvaluateResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Gateway Timeout
      security:
        - accessCookie: []
      summary: Оценить сохранённый голосовой ответ
      tags:
        - Грейдинг и фидбэк
      x-implementation: implemented
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authhttp.LoginRequest'
              description: Тело запроса
              summary: request
        description: Тело запроса
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authhttp.authSession'
          description: OK
