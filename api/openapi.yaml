info:
  description: 'Единый API: implemented — подключённые операции, planned — будущие операции. Variantgen собирает, сохраняет и читает варианты; грейдинг, ответы и тренировка находятся вне его scope. Источник — текущий ML CSV/XLSX. Даты — Unix seconds; cookies Secure/HttpOnly.'
  title: AI Tutor Backend API
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/competency-map/import:
    post:
      description: Доступно только admin. Импорт атомарно заменяет учебную базу.
      operationId: importCompetencyMap
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  description: Карта компетенций CSV или XLSX, до 25 МиБ
                  format: binary
                  type: string
              required:
                - file
              type: object
        description: Карта компетенций CSV или XLSX, до 25 МиБ
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/competencyhttp.ImportResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
