info:
  description: 'Единый API: implemented — подключённые операции, planned — будущие операции. Variantgen собирает, сохраняет и читает варианты; грейдинг, ответы и тренировка находятся вне его scope. Источник — текущий ML CSV/XLSX. Даты — Unix seconds; cookies Secure/HttpOnly.'
  title: AI Tutor Backend API
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/materials:
    post:
      operationId: importMaterial
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taskgenhttp.ImportMaterialRequest'
              description: Текст и связи материала
              summary: request
        description: Текст и связи материала
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Загрузить учебный материал в контекст RAG
      tags:
        - Учебная база
      x-implementation: implemented
  /admin/subjects:
    post:
      description: Создать предмет без карты компетенций. Доступно только admin.
      operationId: createSubject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjecthttp.CreateRequest'
              description: Название предмета
              summary: request
        description: Название предмета
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject.Subject'
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Создать предмет
      tags:
        - Предметы
      x-implementation: implemented
  /admin/subjects/{subject_id}/competency-map/import:
    post:
      description: Доступно только admin. Импорт атомарно заменяет карту указанного предмета.
      operationId: importSubjectCompetencyMap
      parameters:
        - description: ID предмета
          in: path
          name: subject_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              additionalProperties: false
              properties:
                file:
                  description: Карта компетенций CSV или XLSX, до 25 МиБ
                  format: binary
                  type: string
              required:
                - file
              type: object
        description: Карта компетенций CSV или XLSX, до 25 МиБ
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/competencyhttp.ImportResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Заменить карту предмета
      tags:
        - Учебная база
      x-implementation: implemented
