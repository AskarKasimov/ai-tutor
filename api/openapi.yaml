components:
  schemas:
    app.HealthResponse:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    authhttp.LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    authhttp.RegisterRequest:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 200
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 4
          type: string
      required:
        - display_name
        - email
        - password
      type: object
    authhttp.authSession:
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/authhttp.wireExpiry'
        user:
          $ref: '#/components/schemas/authhttp.wireUser'
      required:
        - session
        - user
      type: object
    authhttp.wireExpiry:
      additionalProperties: false
      properties:
        access_expires_at:
          type: integer
        refresh_expires_at:
          type: integer
      required:
        - access_expires_at
        - refresh_expires_at
      type: object
    authhttp.wireUser:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/user.Role'
      required:
        - created_at
        - display_name
        - email
        - id
        - role
      type: object
    coursegraph.Snapshot:
      additionalProperties: false
      properties:
        attempts:
          type: integer
        error_message:
          type: string
        graph:
          type:
            - object
            - "null"
        graph_source:
          enum:
            - built
            - fixture
            - none
          type: string
        inputs_ready:
          type: boolean
        stale:
          type: boolean
        status:
          enum:
            - not_requested
            - pending
            - processing
            - ready
            - failed
          type: string
        updated_at:
          type: integer
      required:
        - attempts
        - error_message
        - graph
        - graph_source
        - inputs_ready
        - stale
        - status
        - updated_at
      type: object
    fault.Detail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - code
        - message
      type: object
    fault.Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/fault.Detail'
          type: array
          uniqueItems: false
        message:
          type: string
      required:
        - code
        - message
      type: object
    geek.AnswerRequest:
      additionalProperties: false
      properties:
        dont_know:
          description: 'Кнопка «Не знаю» без оценки моделью: на основной вопрос или переформулировку — пробел, на дополнительный — К3 и К4 на 0'
          type: boolean
        text:
          description: Текстовый ответ
          maxLength: 4000
          minLength: 1
          type: string
        transcription_id:
          description: Расшифровка из POST /voice/transcriptions, подтверждённая студентом
          minLength: 1
          type: string
        turn_id:
          description: current_turn_id сессии
          minLength: 1
          type: string
      required:
        - turn_id
      type: object
    geek.CoverageItem:
      additionalProperties: false
      properties:
        criteria:
          anyOf:
            - $ref: '#/components/schemas/geek.Criteria'
            - type: "null"
        evidence_lines:
          items:
            description: Строки транскрипта, на которых основан вывод
            minimum: 1
            type: integer
          type: array
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        node_id:
          type: string
        status:
          $ref: '#/components/schemas/geek.NodeStatus'
        title:
          type: string
        top_level:
          description: 'Вершина верхнего уровня: не пререквизит ни одной другой'
          type: boolean
      required:
        - criteria
        - evidence_lines
        - grade
        - node_id
        - status
        - title
        - top_level
      type: object
    geek.Criteria:
      additionalProperties: false
      description: К1 корректность и терминология, К2 логика и обоснование, К3 возражения и контрпримеры, К4 изменённые условия; 0/1/2
      properties:
        k1:
          maximum: 2
          minimum: 0
          type: integer
        k2:
          maximum: 2
          minimum: 0
          type: integer
        k3:
          maximum: 2
          minimum: 0
          type: integer
        k4:
          maximum: 2
          minimum: 0
          type: integer
      required:
        - k1
        - k2
        - k3
        - k4
      type: object
    geek.Gap:
      additionalProperties: false
      properties:
        learning_materials:
          $ref: '#/components/schemas/geek.LearningMaterials'
        node_id:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/geek.SourceCitation'
          type: array
          uniqueItems: false
        title:
          type: string
        weeks:
          items:
            type: integer
          type: array
          uniqueItems: false
      required:
        - learning_materials
        - node_id
        - sources
        - title
        - weeks
      type: object
    geek.GraphBuild:
      additionalProperties: false
      description: Последняя сборка графа курса. Даты — Unix seconds.
      properties:
        error:
          type:
            - string
            - "null"
        finished_at:
          type:
            - integer
            - "null"
        stage:
          anyOf:
            - $ref: '#/components/schemas/geek.GraphBuildStage'
            - type: "null"
        started_at:
          type: integer
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          type: string
      required:
        - error
        - finished_at
        - stage
        - started_at
        - status
      type: object
    geek.GraphBuildStage:
      description: Текущий этап сборки в course-graph
      enum:
        - cleaning
        - units
        - dedup
        - prerequisites
        - validation
      type: string
    geek.History:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/geek.HistoryItem'
          type: array
          uniqueItems: false
      required:
        - items
      type: object
    geek.HistoryItem:
      additionalProperties: false
      properties:
        completed_at:
          type:
            - integer
            - "null"
        grade:
          description: Предварительная оценка курса; null — диагностика не завершена или ни одной темы верхнего уровня с оценкой
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        id:
          type: string
        progress_percent:
          maximum: 100
          minimum: 0
          type: integer
        score_percent:
          maximum: 100
          minimum: 0
          type:
            - integer
            - "null"
        started_at:
          type: integer
        status:
          enum:
            - active
            - completed
            - cancelled
          type: string
      required:
        - completed_at
        - grade
        - id
        - progress_percent
        - score_percent
        - started_at
        - status
      type: object
    geek.LearningMaterials:
      additionalProperties: false
      properties:
        additional:
          items:
            $ref: '#/components/schemas/geek.MaterialReference'
          type: array
          uniqueItems: false
        practice:
          items:
            $ref: '#/components/schemas/geek.MaterialReference'
          type: array
          uniqueItems: false
        theory:
          items:
            $ref: '#/components/schemas/geek.MaterialReference'
          type: array
          uniqueItems: false
      required:
        - additional
        - practice
        - theory
      type: object
    geek.MaterialReference:
      additionalProperties: false
      properties:
        filename:
          type:
            - string
            - "null"
        kind:
          type:
            - string
            - "null"
        kind_label:
          type:
            - string
            - "null"
        material_id:
          type: string
        material_revision:
          type:
            - string
            - "null"
        week:
          type:
            - integer
            - "null"
      required:
        - filename
        - kind
        - kind_label
        - material_id
        - material_revision
        - week
      type: object
    geek.NodeResult:
      additionalProperties: false
      properties:
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        node_id:
          type: string
        status:
          description: independent — самостоятельный ответ, assisted — ответ с помощью, gap — пробел, insufficient — недостаточно данных, credited_by_parent — засчитано по вышестоящей вершине (для неё это пререквизит), unchecked — не спрашивалась
          enum:
            - independent
            - assisted
            - gap
            - insufficient
            - credited_by_parent
            - unchecked
          type: string
        title:
          type: string
        top_level:
          description: 'Вершина верхнего уровня: не пререквизит ни одной другой; по ним считается оценка курса'
          type: boolean
      required:
        - grade
        - node_id
        - status
        - title
        - top_level
      type: object
    geek.NodeStatus:
      description: independent — самостоятельный ответ, assisted — ответ с помощью, gap — пробел, insufficient — недостаточно данных, credited_by_parent — засчитано по вышестоящей вершине (для неё это пререквизит), unchecked — не спрашивалась
      enum:
        - independent
        - assisted
        - gap
        - insufficient
        - credited_by_parent
        - unchecked
      type: string
    geek.Observation:
      additionalProperties: false
      description: Наблюдение по критерию для пробела; к показу 18.10 список пуст
      properties:
        criterion:
          enum:
            - k1
            - k2
            - k3
            - k4
          type: string
        lines:
          items:
            minimum: 1
            type: integer
          type: array
        node_id:
          type: string
        text:
          type: string
      required:
        - criterion
        - lines
        - node_id
        - text
      type: object
    geek.Report:
      additionalProperties: false
      description: Пакет для преподавателя
      properties:
        coverage:
          items:
            $ref: '#/components/schemas/geek.CoverageItem'
          type: array
        observations:
          items:
            $ref: '#/components/schemas/geek.Observation'
          type: array
        session:
          $ref: '#/components/schemas/geek.SessionSummary'
        subject_id:
          type: string
        transcript:
          items:
            $ref: '#/components/schemas/geek.Turn'
          type: array
      required:
        - coverage
        - observations
        - session
        - subject_id
        - transcript
      type: object
    geek.Result:
      additionalProperties: false
      properties:
        gaps:
          items:
            $ref: '#/components/schemas/geek.Gap'
          type: array
          uniqueItems: false
        grade:
          description: Предварительная оценка курса A–D по среднему баллу вершин верхнего уровня; null — ни одной такой вершины с оценкой
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        nodes:
          items:
            $ref: '#/components/schemas/geek.NodeResult'
          type: array
          uniqueItems: false
        score_percent:
          description: Средний балл вершин верхнего уровня (A=4…D=1) в процентах от 4; вершины «недостаточно данных» исключены
          maximum: 100
          minimum: 0
          type:
            - integer
            - "null"
        session_id:
          type: string
      required:
        - gaps
        - grade
        - nodes
        - score_percent
        - session_id
      type: object
    geek.Session:
      additionalProperties: false
      properties:
        completed_at:
          type:
            - integer
            - "null"
        current_turn_id:
          description: Реплика Geek, на которую ждут ответ; null, если сессия не active
          type:
            - string
            - "null"
        id:
          type: string
        progress_percent:
          description: Доля тем верхнего уровня, по которым вывод уже сделан, вместе со спуском; не уменьшается
          maximum: 100
          minimum: 0
          type: integer
        started_at:
          type: integer
        status:
          description: cancelled — граф курса пересобран во время диагностики
          enum:
            - active
            - completed
            - cancelled
          type: string
        subject_id:
          type: string
        turns:
          items:
            $ref: '#/components/schemas/geek.Turn'
          type: array
          uniqueItems: false
      required:
        - completed_at
        - current_turn_id
        - id
        - progress_percent
        - started_at
        - status
        - subject_id
        - turns
      type: object
    geek.SessionList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/geek.SessionSummary'
          type: array
      required:
        - items
      type: object
    geek.SessionSummary:
      additionalProperties: false
      properties:
        completed_at:
          type:
            - integer
            - "null"
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        id:
          type: string
        started_at:
          type: integer
        status:
          enum:
            - active
            - completed
            - cancelled
          type: string
        student:
          $ref: '#/components/schemas/geek.Student'
      required:
        - completed_at
        - grade
        - id
        - started_at
        - status
        - student
      type: object
    geek.SourceCitation:
      additionalProperties: false
      properties:
        block_id:
          type: integer
        end:
          type: integer
        filename:
          type:
            - string
            - "null"
        kind:
          type:
            - string
            - "null"
        kind_label:
          type:
            - string
            - "null"
        material_id:
          type: string
        material_revision:
          type:
            - string
            - "null"
        page:
          type:
            - integer
            - "null"
        start:
          type: integer
        text:
          type: string
        week:
          type:
            - integer
            - "null"
      required:
        - block_id
        - end
        - filename
        - kind
        - kind_label
        - material_id
        - material_revision
        - page
        - start
        - text
        - week
      type: object
    geek.StartRequest:
      additionalProperties: false
      properties:
        subject_id:
          minLength: 1
          type: string
      required:
        - subject_id
      type: object
    geek.Student:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          type: string
      required:
        - display_name
        - id
      type: object
    geek.Turn:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        kind:
          description: question — основной вопрос, followup — дополнительный, rephrase — переформулировка, closing — завершение, answer — ответ студента
          enum:
            - question
            - followup
            - rephrase
            - closing
            - answer
          type: string
        line:
          description: Номер строки транскрипта
          minimum: 1
          type: integer
        node_id:
          description: Вершина графа, к которой относится реплика; null у closing
          type:
            - string
            - "null"
        reply:
          description: 'Начало text у реплики Geek — реакция на прошлый ответ студента; пусто, если реакции нет. Озвучивается отдельно: GET .../audio?part=reply, остальное — part=question'
          type: string
        source:
          description: 'Только у реплик студента: голос после подтверждения, текст или кнопка «Не знаю»'
          enum:
            - voice
            - text
            - dont_know
            - null
          type:
            - string
            - "null"
        speaker:
          enum:
            - geek
            - student
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - kind
        - line
        - node_id
        - reply
        - source
        - speaker
        - text
      type: object
    http.DeleteResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    http.UpdateMetadataRequest:
      additionalProperties: false
      properties:
        kind:
          type: string
        week:
          type: integer
      type: object
    http.UploadFailedItem:
      additionalProperties: false
      properties:
        code:
          type: string
        filename:
          type: string
        message:
          type: string
      required:
        - code
        - filename
        - message
      type: object
    http.UploadItemResult:
      additionalProperties: false
      properties:
        client_id:
          type: string
        error:
          $ref: '#/components/schemas/http.UploadFailedItem'
        material:
          $ref: '#/components/schemas/material.Material'
      required:
        - client_id
      type: object
    http.UploadResult:
      additionalProperties: false
      properties:
        failed:
          items:
            $ref: '#/components/schemas/http.UploadFailedItem'
          type: array
          uniqueItems: false
        results:
          items:
            $ref: '#/components/schemas/http.UploadItemResult'
          type: array
          uniqueItems: false
        uploaded:
          items:
            $ref: '#/components/schemas/material.Material'
          type: array
          uniqueItems: false
      required:
        - failed
        - results
        - uploaded
      type: object
    material.Cleaning:
      additionalProperties: false
      properties:
        attempts:
          type: integer
        cleaned_text:
          type: string
        error_message:
          type: string
        s3_cleaned_key:
          type: string
        s3_report_key:
          type: string
        status:
          enum:
            - pending
            - processing
            - ready
            - failed
          type: string
        updated_at:
          type: integer
      required:
        - attempts
        - cleaned_text
        - error_message
        - s3_cleaned_key
        - s3_report_key
        - status
        - updated_at
      type: object
    material.KindOption:
      additionalProperties: false
      properties:
        code:
          type: string
        label:
          type: string
      required:
        - code
        - label
      type: object
    material.Material:
      additionalProperties: false
      properties:
        char_count:
          type: integer
        cleaning:
          $ref: '#/components/schemas/material.Cleaning'
        content_type:
          type: string
        created_at:
          type: integer
        error_message:
          type: string
        file_size:
          type: integer
        filename:
          type: string
        id:
          type: string
        kind:
          type:
            - string
            - "null"
        kind_label:
          type: string
        ocr_report:
          additionalProperties: {}
          type:
            - object
            - "null"
        parsed_text:
          type: string
        processing:
          $ref: '#/components/schemas/material.Processing'
        s3_parsed_key:
          type: string
        s3_raw_key:
          type: string
        status:
          $ref: '#/components/schemas/material.Status'
        subject_id:
          type: string
        updated_at:
          type: integer
        week:
          type:
            - integer
            - "null"
      required:
        - char_count
        - content_type
        - created_at
        - file_size
        - filename
        - id
        - kind
        - kind_label
        - ocr_report
        - parsed_text
        - s3_parsed_key
        - s3_raw_key
        - status
        - subject_id
        - updated_at
        - week
      type: object
    material.Processing:
      additionalProperties: false
      properties:
        attempts:
          type: integer
        stage:
          enum:
            - queued
            - waiting_models
            - ocr
            - translation
            - cleaning
            - graph
            - ready
            - failed
          type: string
        status:
          enum:
            - pending
            - processing
            - ready
            - failed
          type: string
        updated_at:
          type: integer
      required:
        - attempts
        - stage
        - status
        - updated_at
      type: object
    material.Status:
      enum:
        - pending
        - parsed
        - failed
      type: string
      x-enum-varnames:
        - StatusPending
        - StatusParsed
        - StatusFailed
    subject.Subject:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        ready:
          type: boolean
      required:
        - id
        - name
        - ready
      type: object
    subjecthttp.CreateRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    user.Role:
      enum:
        - student
        - admin
      type: string
      x-enum-varnames:
        - Student
        - Admin
    voicehttp.SynthesizeRequest:
      additionalProperties: false
      properties:
        text:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - text
      type: object
    voicehttp.Transcription:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - text
      type: object
  securitySchemes:
    accessCookie:
      in: cookie
      name: access_token
      type: apiKey
    refreshCookie:
      in: cookie
      name: refresh_token
      type: apiKey
info:
  description: 'Единый API Geek: implemented — подключённые операции, planned — будущие операции. Курс строится из материалов; диагностика — устный экзамен по графу курса. Даты — Unix seconds; cookies Secure/HttpOnly.'
  title: AI Tutor Backend API
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/diagnostic-sessions/{id}/report:
    get:
      description: Доступно только admin. Транскрипт с номерами строк, карта покрытия с критериями и основаниями, наблюдения.
      parameters:
        - description: ID диагностики
          in: path
          name: id
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/geek.Report'
          description: OK
        "401":
          content:
            application/json:
