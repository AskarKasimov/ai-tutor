components:
  schemas:
    app.HealthResponse:
      additionalProperties: false
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
    authhttp.LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
    authhttp.RegisterRequest:
      additionalProperties: false
      properties:
        display_name:
          maxLength: 200
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 15
          type: string
      required:
        - display_name
        - email
        - password
      type: object
    authhttp.authSession:
      additionalProperties: false
      properties:
        session:
          $ref: '#/components/schemas/authhttp.wireExpiry'
        user:
          $ref: '#/components/schemas/authhttp.wireUser'
      required:
        - session
        - user
      type: object
    authhttp.wireExpiry:
      additionalProperties: false
      properties:
        access_expires_at:
          type: integer
        refresh_expires_at:
          type: integer
      required:
        - access_expires_at
        - refresh_expires_at
      type: object
    authhttp.wireUser:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/user.Role'
      required:
        - created_at
        - display_name
        - email
        - id
        - role
      type: object
    fault.Detail:
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - code
        - message
      type: object
    fault.Error:
      additionalProperties: false
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/fault.Detail'
          type: array
          uniqueItems: false
        message:
          type: string
      required:
        - code
        - message
      type: object
    geek.AnswerRequest:
      additionalProperties: false
      description: Ровно одно из transcription_id, text, dont_know
      oneOf:
        - required:
            - transcription_id
        - required:
            - text
        - required:
            - dont_know
      properties:
        dont_know:
          const: true
          description: 'Кнопка «Не знаю»: пробел без оценки моделью'
        text:
          description: Текстовый ответ
          maxLength: 4000
          minLength: 1
          type: string
        transcription_id:
          description: Расшифровка из POST /voice/transcriptions, подтверждённая студентом
          minLength: 1
          type: string
        turn_id:
          description: current_turn_id сессии
          minLength: 1
          type: string
      required:
        - turn_id
      type: object
    geek.CoverageItem:
      additionalProperties: false
      properties:
        criteria:
          anyOf:
            - $ref: '#/components/schemas/geek.Criteria'
            - type: "null"
        evidence_lines:
          items:
            description: Строки транскрипта, на которых основан вывод
            minimum: 1
            type: integer
          type: array
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        level:
          enum:
            - topic
            - subtopic
          type: string
        node_id:
          type: string
        parent_id:
          type:
            - string
            - "null"
        status:
          $ref: '#/components/schemas/geek.NodeStatus'
        title:
          type: string
      required:
        - criteria
        - evidence_lines
        - grade
        - level
        - node_id
        - parent_id
        - status
        - title
      type: object
    geek.Criteria:
      additionalProperties: false
      description: К1 корректность и терминология, К2 логика и обоснование, К3 возражения и контрпримеры, К4 изменённые условия; 0/1/2
      properties:
        k1:
          maximum: 2
          minimum: 0
          type: integer
        k2:
          maximum: 2
          minimum: 0
          type: integer
        k3:
          maximum: 2
          minimum: 0
          type: integer
        k4:
          maximum: 2
          minimum: 0
          type: integer
      required:
        - k1
        - k2
        - k3
        - k4
      type: object
    geek.Gap:
      additionalProperties: false
      description: Самая глубокая неосвоенная вершина, все пререквизиты которой освоены
      properties:
        node_id:
          type: string
        sources:
          items:
            $ref: '#/components/schemas/geek.Source'
          type: array
        title:
          type: string
        topic_title:
          type: string
        week:
          minimum: 1
          type: integer
      required:
        - node_id
        - sources
        - title
        - topic_title
        - week
      type: object
    geek.Graph:
      additionalProperties: false
      description: 'Граф курса: одна версия на курс, пересборка заменяет его целиком'
      properties:
        built_at:
          type: integer
        subject_id:
          type: string
        topics:
          items:
            $ref: '#/components/schemas/geek.GraphTopic'
          type: array
      required:
        - built_at
        - subject_id
        - topics
      type: object
    geek.GraphBuild:
      additionalProperties: false
      description: Последняя сборка графа курса. Даты — Unix seconds.
      properties:
        error:
          type:
            - string
            - "null"
        finished_at:
          type:
            - integer
            - "null"
        stage:
          anyOf:
            - $ref: '#/components/schemas/geek.GraphBuildStage'
            - type: "null"
        started_at:
          type: integer
        status:
          enum:
            - queued
            - running
            - succeeded
            - failed
          type: string
      required:
        - error
        - finished_at
        - stage
        - started_at
        - status
      type: object
    geek.GraphBuildStage:
      description: Текущий этап сборки в course-graph
      enum:
        - cleaning
        - units
        - dedup
        - prerequisites
        - validation
      type: string
    geek.GraphSubtopic:
      additionalProperties: false
      description: Подтема. Пререквизиты — подтемы любых тем курса; граф пререквизитов ацикличен.
      properties:
        content:
          description: Текст вершины из материалов, на русском
          type: string
        id:
          type: string
        position:
          description: Порядок внутри родителя
          minimum: 0
          type: integer
        prerequisites:
          items:
            description: ID подтемы-пререквизита
            type: string
          type: array
        sources:
          items:
            $ref: '#/components/schemas/geek.Source'
          type: array
        title:
          description: Название на русском
          type: string
        week:
          description: Самая ранняя неделя источников
          minimum: 1
          type: integer
      required:
        - content
        - id
        - position
        - prerequisites
        - sources
        - title
        - week
      type: object
    geek.GraphTopic:
      additionalProperties: false
      description: Верхнеуровневая тема курса
      properties:
        content:
          description: Текст вершины из материалов, на русском
          type: string
        id:
          type: string
        position:
          description: Порядок внутри родителя
          minimum: 0
          type: integer
        sources:
          items:
            $ref: '#/components/schemas/geek.Source'
          type: array
        subtopics:
          items:
            $ref: '#/components/schemas/geek.GraphSubtopic'
          type: array
        title:
          description: Название на русском
          type: string
        week:
          description: Самая ранняя неделя источников
          minimum: 1
          type: integer
      required:
        - content
        - id
        - position
        - sources
        - subtopics
        - title
        - week
      type: object
    geek.Material:
      additionalProperties: false
      properties:
        char_count:
          type: integer
        content_type:
          type: string
        created_at:
          type: integer
        error_message:
          type: string
        file_size:
          type: integer
        filename:
          type: string
        id:
          type: string
        kind:
          anyOf:
            - $ref: '#/components/schemas/geek.MaterialKind'
            - type: "null"
          description: Вид материала; null — у материалов, загруженных до появления поля
        parsed_text:
          type: string
        s3_parsed_key:
          type: string
        s3_raw_key:
          type: string
        status:
          $ref: '#/components/schemas/material.Status'
        subject_id:
          type: string
        updated_at:
          type: integer
        week:
          description: Неделя курса; null — у материалов, загруженных до появления поля
          minimum: 1
          type:
            - integer
            - "null"
      required:
        - char_count
        - content_type
        - created_at
        - file_size
        - filename
        - id
        - kind
        - parsed_text
        - s3_parsed_key
        - s3_raw_key
        - status
        - subject_id
        - updated_at
        - week
      type: object
    geek.MaterialKind:
      description: Вид материала
      enum:
        - lecture
        - lab
        - tutorial
      type: string
    geek.MaterialPatch:
      additionalProperties: false
      description: Правка недели и вида без повторного OCR; хотя бы одно поле
      properties:
        kind:
          $ref: '#/components/schemas/geek.MaterialKind'
        week:
          minimum: 1
          type: integer
      required: []
      type: object
    geek.NodeResult:
      additionalProperties: false
      properties:
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        node_id:
          type: string
        status:
          $ref: '#/components/schemas/geek.NodeStatus'
        title:
          type: string
      required:
        - grade
        - node_id
        - status
        - title
      type: object
    geek.NodeStatus:
      description: independent — самостоятельный ответ, assisted — ответ с помощью, gap — пробел, insufficient — недостаточно данных, credited_by_parent — засчитано по вышестоящей теме, unchecked — не спрашивалась
      enum:
        - independent
        - assisted
        - gap
        - insufficient
        - credited_by_parent
        - unchecked
      type: string
    geek.Observation:
      additionalProperties: false
      description: Наблюдение по критерию для пробела; к показу 18.10 список пуст
      properties:
        criterion:
          enum:
            - k1
            - k2
            - k3
            - k4
          type: string
        lines:
          items:
            minimum: 1
            type: integer
          type: array
        node_id:
          type: string
        text:
          type: string
      required:
        - criterion
        - lines
        - node_id
        - text
      type: object
    geek.Report:
      additionalProperties: false
      description: Пакет для преподавателя
      properties:
        coverage:
          items:
            $ref: '#/components/schemas/geek.CoverageItem'
          type: array
        observations:
          items:
            $ref: '#/components/schemas/geek.Observation'
          type: array
        session:
          $ref: '#/components/schemas/geek.SessionSummary'
        subject_id:
          type: string
        transcript:
          items:
            $ref: '#/components/schemas/geek.Turn'
          type: array
      required:
        - coverage
        - observations
        - session
        - subject_id
        - transcript
      type: object
    geek.Result:
      additionalProperties: false
      description: Итог для студента; баллы по критериям и основания — только в пакете для преподавателя
      properties:
        gaps:
          items:
            $ref: '#/components/schemas/geek.Gap'
          type: array
        grade:
          description: Предварительная оценка курса A–D по среднему баллу верхнеуровневых тем; null — ни одной темы с оценкой
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        score_percent:
          description: Средний балл тем (A=4…D=1) в процентах от 4; темы «недостаточно данных» исключены
          maximum: 100
          minimum: 0
          type:
            - integer
            - "null"
        session_id:
          type: string
        topics:
          items:
            $ref: '#/components/schemas/geek.TopicResult'
          type: array
      required:
        - gaps
        - grade
        - score_percent
        - session_id
        - topics
      type: object
    geek.Session:
      additionalProperties: false
      properties:
        completed_at:
          type:
            - integer
            - "null"
        current_turn_id:
          description: Реплика Geek, на которую ждут ответ; null, если сессия не active
          type:
            - string
            - "null"
        id:
          type: string
        progress_percent:
          description: Доля верхнеуровневых тем, по которым вывод уже сделан, вместе со спуском; не уменьшается
          maximum: 100
          minimum: 0
          type: integer
        started_at:
          type: integer
        status:
          description: cancelled — граф курса пересобран во время диагностики
          enum:
            - active
            - completed
            - cancelled
          type: string
        subject_id:
          type: string
        turns:
          items:
            $ref: '#/components/schemas/geek.Turn'
          type: array
      required:
        - completed_at
        - current_turn_id
        - id
        - progress_percent
        - started_at
        - status
        - subject_id
        - turns
      type: object
    geek.SessionList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/geek.SessionSummary'
          type: array
      required:
        - items
      type: object
    geek.SessionSummary:
      additionalProperties: false
      properties:
        completed_at:
          type:
            - integer
            - "null"
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        id:
          type: string
        started_at:
          type: integer
        status:
          enum:
            - active
            - completed
            - cancelled
          type: string
        student:
          $ref: '#/components/schemas/geek.Student'
      required:
        - completed_at
        - grade
        - id
        - started_at
        - status
        - student
      type: object
    geek.Source:
      additionalProperties: false
      description: Материал, из которого взята вершина
      properties:
        filename:
          type: string
        kind:
          $ref: '#/components/schemas/geek.MaterialKind'
        material_id:
          type: string
        week:
          minimum: 1
          type: integer
      required:
        - filename
        - kind
        - material_id
        - week
      type: object
    geek.StartRequest:
      additionalProperties: false
      properties:
        subject_id:
          minLength: 1
          type: string
      required:
        - subject_id
      type: object
    geek.Student:
      additionalProperties: false
      properties:
        display_name:
          type: string
        id:
          type: string
      required:
        - display_name
        - id
      type: object
    geek.TopicResult:
      additionalProperties: false
      properties:
        grade:
          description: Оценка A–D; null — оценки нет (тема не проверялась или недостаточно данных)
          enum:
            - A
            - B
            - C
            - D
            - null
          type:
            - string
            - "null"
        node_id:
          type: string
        status:
          $ref: '#/components/schemas/geek.NodeStatus'
        subtopics:
          items:
            $ref: '#/components/schemas/geek.NodeResult'
          type: array
        title:
          type: string
      required:
        - grade
        - node_id
        - status
        - subtopics
        - title
      type: object
    geek.Turn:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        kind:
          description: question — основной вопрос, followup — дополнительный, rephrase — переформулировка, closing — завершение, answer — ответ студента
          enum:
            - question
            - followup
            - rephrase
            - closing
            - answer
          type: string
        line:
          description: Номер строки транскрипта
          minimum: 1
          type: integer
        node_id:
          description: Вершина графа, к которой относится реплика; null у closing
          type:
            - string
            - "null"
        source:
          description: 'Только у реплик студента: голос после подтверждения, текст или кнопка «Не знаю»'
          enum:
            - voice
            - text
            - dont_know
            - null
          type:
            - string
            - "null"
        speaker:
          enum:
            - geek
            - student
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - kind
        - line
        - node_id
        - source
        - speaker
        - text
      type: object
    geek.UploadResult:
      additionalProperties: false
      properties:
        failed:
          items:
            $ref: '#/components/schemas/http.UploadFailedItem'
          type: array
        uploaded:
          items:
            $ref: '#/components/schemas/geek.Material'
          type: array
      required:
        - failed
        - uploaded
      type: object
    http.DeleteResponse:
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
      type: object
    http.UploadFailedItem:
      additionalProperties: false
      properties:
        code:
          type: string
        filename:
          type: string
        message:
          type: string
      required:
        - code
        - filename
        - message
      type: object
    material.Status:
      enum:
        - pending
        - parsed
        - failed
      type: string
      x-enum-varnames:
        - StatusPending
        - StatusParsed
        - StatusFailed
    subject.Subject:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        ready:
          type: boolean
      required:
        - id
        - name
        - ready
      type: object
    subjecthttp.CreateRequest:
      additionalProperties: false
      properties:
        name:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - name
      type: object
    user.Role:
      enum:
        - student
        - admin
      type: string
      x-enum-varnames:
        - Student
        - Admin
    voicehttp.SynthesizeRequest:
      additionalProperties: false
      properties:
        text:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - text
      type: object
    voicehttp.Transcription:
      additionalProperties: false
      properties:
        created_at:
          type: integer
        id:
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - text
      type: object
  securitySchemes:
    accessCookie:
      in: cookie
      name: access_token
      type: apiKey
    refreshCookie:
      in: cookie
      name: refresh_token
      type: apiKey
info:
  description: 'Единый API Geek: implemented — подключённые операции, planned — будущие операции. Курс строится из материалов; диагностика — устный экзамен по графу курса. Даты — Unix seconds; cookies Secure/HttpOnly.'
  title: AI Tutor Backend API
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/diagnostic-sessions/{id}/report:
    get:
      description: Доступно только admin. Транскрипт с номерами строк, карта покрытия с критериями и основаниями, наблюдения.
      parameters:
        - description: ID диагностики
          in: path
          name: id
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/geek.Report'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
      security:
        - accessCookie: []
      summary: Пакет для преподавателя
      tags:
        - Пакет для преподавателя
      x-implementation: planned
  /admin/subjects:
    post:
      description: Создать предмет без карты компетенций. Доступно только admin.
      operationId: createSubject
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/subjecthttp.CreateRequest'
              description: Название предмета
              summary: request
        description: Название предмета
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/subject.Subject'
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Создать предмет
      tags:
        - Предметы
      x-implementation: implemented
  /admin/subjects/{subject_id}/diagnostic-sessions:
    get:
      description: Доступно только admin. Все диагностики курса, новые первыми.
      parameters:
        - description: ID курса (предмета)
          in: path
          name: subject_id
          required: true
          schema:
            maxLength: 128
            minLength: 1
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/geek.SessionList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
