<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-репетитор</title>
<style>
  /* Tokens of the releases' theme (services/frontend/src/bootstrap/global.scss). */
  :root {
    --app-ink: #172a38; --app-muted: #738394; --app-accent: #326fe8; --app-accent-strong: #2159c6;
    --app-soft: #eaf0ff; --app-border: #dee7f1; --app-success: #0ea777; --app-success-soft: #e8f6f0;
    --app-error: #b44338; --app-bg: #f6f8fb; --app-panel: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --app-ink: #e8edf6; --app-muted: #9aa7bd; --app-accent: #6d98ff; --app-accent-strong: #8fb0ff;
      --app-soft: #1f2b45; --app-border: #2c3545; --app-success: #34c99a; --app-success-soft: #173a30;
      --app-error: #ff8b80; --app-bg: #11151d; --app-panel: #1a202b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--app-bg); color: var(--app-ink);
    font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; }
  button:not(:disabled) { cursor: pointer; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--app-accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 12px 24px;
    background: var(--app-panel); border-bottom: 1px solid var(--app-border);
  }
  .brand { font-weight: 700; font-size: 18px; }
  .account { margin-left: auto; position: relative; min-width: 0; }
  .profile {
    display: inline-flex; align-items: center; gap: 10px; min-width: 0; padding: 4px 12px 4px 4px;
    border: 1px solid var(--app-border); border-radius: 999px; background: var(--app-panel);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .profile:hover, .profile[aria-expanded="true"] { border-color: var(--app-accent); box-shadow: 0 0 0 3px var(--app-soft); }
  .profile svg { flex: none; color: var(--app-muted); }
  .avatar {
    flex: none; display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%;
    background: var(--app-soft); color: var(--app-accent); box-shadow: inset 0 0 0 1px var(--app-border);
    font-size: 14px; font-weight: 700; letter-spacing: .02em;
  }
  .user { font-size: 15px; font-weight: 600; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px); min-width: 180px; padding: 6px; z-index: 1;
    background: var(--app-panel); border: 1px solid var(--app-border); border-radius: 12px;
    box-shadow: 0 12px 32px rgb(23 42 56 / .14);
  }
  .menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-radius: 8px;
    background: none; color: var(--app-error); text-align: left;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--app-soft); outline: none; }

  main { display: grid; place-items: center; padding: 48px 16px; }
  .card {
    width: 100%; max-width: 520px; padding: 28px; background: var(--app-panel);
    border: 1px solid var(--app-border); border-radius: 20px; box-shadow: 0 12px 32px rgb(23 42 56 / .06);
  }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .lead { margin: 0 0 20px; color: var(--app-muted); }

  /* The mode choice is the main content of the page: wider and roomier than the login card. */
  .card.choice { max-width: 760px; padding: 40px; }
  .choice h1 { font-size: 30px; }
  .choice .lead { font-size: 17px; margin-bottom: 28px; }
  .modes { display: grid; gap: 16px; }
  .mode {
    display: flex; align-items: center; gap: 22px; padding: 28px 28px; text-decoration: none; color: inherit;
    border: 1px solid var(--app-border); border-radius: 20px; transition: border-color .15s ease, box-shadow .15s ease;
  }
  .mode:hover { border-color: var(--app-accent); box-shadow: 0 0 0 3px var(--app-soft); }
  .mode .icon { flex: none; display: grid; place-items: center; width: 68px; height: 68px; border-radius: 18px; background: var(--app-soft); color: var(--app-accent); }
  .mode .icon svg { width: 32px; height: 32px; }
  .mode.exam .icon { background: var(--app-success-soft); color: var(--app-success); }
  .mode b { display: block; font-size: 22px; margin-bottom: 2px; color: var(--app-ink); }
  .mode span { color: var(--app-muted); font-size: 17px; }
  .mode .go { margin-left: auto; color: var(--app-muted); flex: none; }

  .tabs { display: flex; gap: 8px; margin-bottom: 8px; }
  .tabs button {
    flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--app-border); background: transparent; color: var(--app-muted);
  }
  .tabs button[aria-selected="true"] { border-color: var(--app-accent); color: var(--app-accent); font-weight: 600; }
  label { display: block; font-size: 14px; color: var(--app-muted); margin: 12px 0 4px; }
  input {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--app-border);
    background: transparent; color: var(--app-ink); font: inherit;
  }
  .hint { font-size: 13px; color: var(--app-muted); margin: 4px 0 0; }
  .submit {
    width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--app-accent); color: #fff; font-weight: 600;
  }
  .submit:hover { background: var(--app-accent-strong); }
  .submit:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--app-error); margin: 12px 0 0; white-space: pre-line; }
  .error:empty { display: none; }

  @media (max-width: 600px) {
    header { padding: 10px 16px; }
    .user { display: none; }
    .avatar { width: 36px; height: 36px; }
    .profile { padding-right: 8px; }
    main { padding: 24px 16px; }
    .card, .card.choice { padding: 20px; }
    .choice h1 { font-size: 24px; }
    .mode { padding: 18px; gap: 16px; }
    .mode .icon { width: 52px; height: 52px; }
    .mode .icon svg { width: 26px; height: 26px; }
    .mode b { font-size: 19px; }
    .mode span { font-size: 15px; }
  }
</style>
</head>
<body>
<header>
  <span class="brand">AI-репетитор</span>
  <div class="account" id="account" hidden>
    <button type="button" class="profile" id="profile" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="user" id="user"></span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" id="logout">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        Выйти
      </button>
    </div>
  </div>
</header>

<main>
  <section class="card choice" id="choice" hidden>
    <h1>Выберите режим</h1>
    <p class="lead">Можно вернуться сюда из меню профиля в любом режиме.</p>
    <div class="modes">
      <a class="mode" id="go-learn">
        <span class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>
        <span><b>Обучение</b><span>Диагностика, план и тренировка по шагам</span></span>
        <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
      <a class="mode exam" id="go-exam">
        <span class="icon" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg></span>
        <span><b>Симуляция экзамена</b><span>Устный экзамен с Geek</span></span>
        <svg class="go" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </a>
    </div>
    <p class="error" id="choice-error" role="alert"></p>
  </section>

  <section class="card" id="auth" hidden>
    <h1>Вход</h1>
    <p class="lead">Один вход для обучения и для симуляции экзамена.</p>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-login" aria-selected="true">Вход</button>
      <button type="button" role="tab" id="tab-register" aria-selected="false">Регистрация</button>
    </div>
    <form id="form" novalidate>
      <div id="name-field" hidden>
        <label for="name">Имя</label>
        <input id="name" autocomplete="name" maxlength="200">
      </div>
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Пароль</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <p class="hint" id="password-hint" hidden>От 4 до 128 символов.</p>
      <button class="submit" id="submit" type="submit">Войти</button>
      <p class="error" id="error" role="alert"></p>
    </form>
  </section>
</main>
<script>
  const releases = [
    { key: 'learn', title: 'Обучение', base: `https://learn.${location.host}` },
    { key: 'exam', title: 'Симуляция экзамена', base: `https://exam.${location.host}` },
  ];
  const $ = (id) => document.getElementById(id);
  let mode = 'login';

  $('go-learn').href = releases[0].base + '/';
  $('go-exam').href = releases[1].base + '/';

  // body: undefined — GET, null — POST without a body (logout rejects one).
  async function call(release, path, body) {
    const json = body !== undefined && body !== null;
    let response;
    try {
      response = await fetch(`${release.base}/api/v1/auth/${path}`, {
        method: body === undefined ? 'GET' : 'POST',
        credentials: 'include',
        headers: json ? { 'Content-Type': 'application/json' } : {},
        body: json ? JSON.stringify(body) : undefined,
      });
    } catch {
      return { ok: false, status: 0, code: 'NETWORK', message: `${release.title}: сервис недоступен.` };
    }
    let data = null;
    try { data = await response.json(); } catch { /* empty body */ }
    const fault = data && (data.error || data);
    return {
      ok: response.ok, status: response.status, data,
      code: fault && fault.code,
      message: (fault && (fault.details?.[0]?.message || fault.message)) || `ошибка ${response.status}`,
    };
  }

  // Logs in to every release. Only once the password is confirmed by one of
  // them, an account missing elsewhere is created with the same credentials,
  // so a user registered in one release gets into both and a wrong password
  // never creates an account.
  async function enter(credentials) {
    const results = [];
    for (const release of releases) results.push(await call(release, 'login', credentials));
    const confirmed = results.find((result) => result.ok);
    if (!confirmed) {
      const failed = results.find((result) => result.status !== 401);
      return [failed || { ok: false, message: 'Неверный email или пароль.' }];
    }
    const name = confirmed.data?.user?.display_name || credentials.email.split('@')[0];
    for (const [index, release] of releases.entries()) {
      if (results[index].ok || results[index].status !== 401) continue;
      const created = await call(release, 'register', { ...credentials, display_name: name });
      results[index] = created.code === 'EMAIL_ALREADY_REGISTERED'
        ? { ...created, message: `${release.title}: пароль не подходит. Пароли в версиях различаются.` }
        : created;
    }
    return results;
  }

  // A taken email in the first release is an existing user: registration
  // stops instead of signing in under the old name. A taken email only in a
  // later release is an account made there before; the same password joins it.
  async function register(release, credentials, name, first) {
    const created = await call(release, 'register', { ...credentials, display_name: name });
    if (created.code !== 'EMAIL_ALREADY_REGISTERED') return created;
    if (first) {
      return { ...created, message: 'Этот email уже зарегистрирован. Войдите на вкладке «Вход».' };
    }
    const login = await call(release, 'login', credentials);
    return login.ok ? login : { ...login, message: `${release.title}: этот email уже занят.` };
  }

  // Same as AccountMenu of the releases.
  function initials(name) {
    const words = name.replace(/@.*$/, '').split(/[\s._-]+/).filter(Boolean);
    return words.slice(0, 2).map((word) => word[0]).join('').toUpperCase() || '?';
  }

  function setMode(next) {
    mode = next;
    $('tab-login').setAttribute('aria-selected', String(next === 'login'));
    $('tab-register').setAttribute('aria-selected', String(next === 'register'));
    $('name-field').hidden = next !== 'register';
    $('password-hint').hidden = next !== 'register';
    $('password').autocomplete = next === 'register' ? 'new-password' : 'current-password';
    $('submit').textContent = next === 'register' ? 'Зарегистрироваться' : 'Войти';
    $('error').textContent = '';
  }

  function closeMenu() {
    $('menu').hidden = true;
    $('profile').setAttribute('aria-expanded', 'false');
  }

  function showChoice(user) {
    const name = user?.display_name || user?.email || '';
    $('avatar').textContent = initials(name);
    $('user').textContent = name;
    $('profile').setAttribute('aria-label', `Меню профиля: ${name}`);
    $('account').hidden = false;
    $('auth').hidden = true;
    $('choice').hidden = false;
  }

  function showAuth(message = '') {
    closeMenu();
    $('account').hidden = true;
    $('choice').hidden = true;
    $('auth').hidden = false;
    $('error').textContent = message;
  }

  // Signs out of both releases; a release already signed out answers 401.
  async function signOut() {
    const results = await Promise.all(releases.map((release) => call(release, 'logout', null)));
    const failed = results.find((result) => !result.ok && result.status !== 401);
    showAuth(failed ? failed.message : '');
  }

  $('tab-login').onclick = () => setMode('login');
  $('tab-register').onclick = () => setMode('register');

  $('profile').onclick = () => {
    const open = $('menu').hidden;
    $('menu').hidden = !open;
    $('profile').setAttribute('aria-expanded', String(open));
    if (open) $('logout').focus();
  };
  document.addEventListener('click', (event) => {
    if (!$('account').contains(event.target)) closeMenu();
  });
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && !$('menu').hidden) {
      closeMenu();
      $('profile').focus();
    }
  });
  $('logout').onclick = signOut;

  $('form').onsubmit = async (event) => {
    event.preventDefault();
    const credentials = { email: $('email').value.trim().toLowerCase(), password: $('password').value };
    const name = $('name').value.trim();
    if (!credentials.email || !credentials.password) {
      $('error').textContent = 'Укажите email и пароль.';
      return;
    }
    if (mode === 'register' && !name) {
      $('error').textContent = 'Укажите имя.';
      return;
    }
    $('submit').disabled = true;
    $('error').textContent = '';
    let results = [];
    if (mode === 'register') {
      // One release at a time: a rejected registration stops before the
      // account exists in the other one.
      for (const [index, release] of releases.entries()) {
        const result = await register(release, credentials, name, index === 0);
        results.push(result);
        if (!result.ok) break;
      }
    } else {
      results = await enter(credentials);
    }
    $('submit').disabled = false;
    const failed = results.find((result) => !result.ok);
    if (failed) {
      $('error').textContent = failed.message;
      return;
    }
    showChoice(results.find((result) => result.data?.user)?.data.user);
  };

  (async () => {
    // «Выйти» inside a release lands here with ?logout to sign out of both.
    const params = new URLSearchParams(location.search);
    if (params.has('logout')) {
      history.replaceState(null, '', location.pathname);
      await signOut();
      return;
    }
    const sessions = await Promise.all(releases.map((release) => call(release, 'me')));
    if (sessions.every((session) => session.ok)) showChoice(sessions[0].data);
    else showAuth();
  })();
</script>
</body>
</html>
