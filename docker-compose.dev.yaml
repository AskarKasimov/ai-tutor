services:
  api:
    build:
      target: dev
    volumes:
      - ./services/backend:/work/backend
      - ./services/voice-gateway:/work/voice-gateway:ro
      - ./services/shared:/work/shared:ro
      - ./services/audio:/work/audio:ro
      - backend_go_modules:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - backend_dev_bin:/work/backend/.air
    environment:
      BACKEND_CONFIG: ${BACKEND_CONFIG:-/work/backend/config/dev.yaml}
    healthcheck:
      test: ["CMD", "/work/backend/.air/api", "healthcheck"]
      start_period: 180s


  llm-gateway:
    build:
      target: dev
    environment:
      GATEWAY_CONFIG: ${GATEWAY_CONFIG:-/work/llm-gateway/config/dev.yaml}
    volumes:
      - ./services/llm-gateway:/work/llm-gateway
      - ./services/shared:/work/shared:ro
      - gateway_go_modules:/go/pkg/mod
      - gateway_go_build:/root/.cache/go-build
      - gateway_dev_bin:/work/llm-gateway/.air

  voice-gateway:
    build:
      target: dev
    entrypoint: []
    command: ["air", "-c", ".air.toml"]
    volumes: !override
      - ./services/voice-gateway:/work/voice-gateway
      - ./services/audio:/work/audio:ro
      - ./services/shared:/work/shared:ro
      - voice_gateway_data:/var/lib/voice-gateway
      - voice_go_modules:/go/pkg/mod
      - voice_go_build:/go/cache
      - voice_dev_bin:/work/voice-gateway/.air
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8020/health/ready"]

  course-graph:
    build:
      target: dev
    environment:
      COURSE_GRAPH_CONFIG: ${COURSE_GRAPH_CONFIG:-/app/config/dev.yaml}
    volumes:
      - ./services/course-graph/course_graph:/app/course_graph
      - ./services/course-graph/config:/app/config:ro
      - ./services/shared/gen/python/llmgateway:/app/llmgateway:ro

  frontend:
    build:
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_API_PROXY_TARGET: http://api:8002
      DEV_POLLING: "true"
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_go_modules:
  backend_go_build:
  backend_dev_bin:
  gateway_go_modules:
  gateway_go_build:
  gateway_dev_bin:
  frontend_node_modules:
