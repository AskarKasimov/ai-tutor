# Common dev stack; service definitions live beside their owners.
services:
  db:
    extends:
      file: ./services/postgresql/docker-compose.yaml
      service: db

  s3:
    extends:
      file: ./services/s3/docker-compose.yaml
      service: s3

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    profiles: [gateway]
    command: [redpanda, start, --mode, dev-container, --smp, "1", --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092", --advertise-kafka-addr, "internal://redpanda:9092,external://localhost:19092"]
    ports: ["127.0.0.1:19092:19092"]
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    profiles: [gateway]
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk topic create llm.requests.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic create llm.state.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic alter-config llm.requests.v1 --set retention.ms=604800000 --set max.message.bytes=2097152 --brokers redpanda:9092; rpk topic alter-config llm.state.v1 --set cleanup.policy=compact --set retention.ms=-1 --set max.message.bytes=41943040 --brokers redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy

  course-graph:
    extends:
      file: ./services/course-graph/docker-compose.yaml
      service: course-graph

  llm-gateway:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: llm-gateway
    profiles: [gateway]
    volumes:
      - ./services/llm-gateway/config.json:/etc/llm-gateway/config.json:ro
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  api:
    extends:
      file: ./services/backend/docker-compose.yaml
      service: api
    build:
      target: dev
    volumes:
      - ./services/backend:/src
      - ./services/shared:/shared:ro
      - backend_go_modules:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - backend_dev_bin:/src/.air
    healthcheck:
      test: ["CMD", "/src/.air/api", "healthcheck"]
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
  swagger:
    extends:
      file: ./services/backend/docker-compose.yaml
      service: swagger

  frontend:
    extends:
      file: ./services/frontend/docker-compose.yaml
      service: frontend
    build:
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env}
      VITE_API_PROXY_TARGET: http://api:8002
      DEV_POLLING: "true"
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules

  proxy:
    extends:
      file: ./services/caddy/docker-compose.yaml
      service: proxy
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  default:
    name: ai-tutor_default

volumes:
  redpanda_data:
    name: ai-tutor_redpanda_data
  postgres_data:
    name: ai-tutor_postgres_data
  task_audio_data:
    name: ai-tutor_task_audio_data
  caddy_data:
    name: ai-tutor_caddy_data
  caddy_config:
    name: ai-tutor_caddy_config
  backend_go_modules:
  backend_go_build:
  backend_dev_bin:
  frontend_node_modules:
