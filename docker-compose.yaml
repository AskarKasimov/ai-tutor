services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ai_tutor
      POSTGRES_USER: ai_tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_tutor -d ai_tutor"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ./services/backend
    environment:
      DATABASE_URL: postgres://ai_tutor:${POSTGRES_PASSWORD}@db:5432/ai_tutor?sslmode=disable
      STT_URL: ${STT_URL:?Set STT_URL in .env}
      TTS_URL: ${TTS_URL:?Set TTS_URL in .env}
      PROCESSING_TIMEOUT: ${PROCESSING_TIMEOUT:-120s}
      AUTH_RATE_LIMIT: ${AUTH_RATE_LIMIT:-30}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend:
    build:
      context: ./services/frontend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    ports:
      - "${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
