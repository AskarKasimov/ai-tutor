# Common dev stack; service definitions live beside their owners.
services:
  db:
    extends:
      file: ./services/postgresql/docker-compose.yaml
      service: db

  s3:
    extends:
      file: ./services/s3/docker-compose.yaml
      service: s3

  redpanda:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: redpanda
    profiles: [gateway]

  redpanda-init:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: redpanda-init
    profiles: [gateway]
    depends_on:
      redpanda:
        condition: service_healthy

  course-graph:
    extends:
      file: ./services/course-graph/docker-compose.yaml
      service: course-graph

  llm-gateway:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: llm-gateway
    profiles: [gateway]
    volumes:
      - ./services/llm-gateway/config.json:/etc/llm-gateway/config.json:ro
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  api:
    extends:
      file: ./services/backend/docker-compose.yaml
      service: api
    build:
      target: dev
    volumes:
      - ./services/backend:/work/backend
      - ./services/shared:/work/shared:ro
      - backend_go_modules:/go/pkg/mod
      - backend_go_build:/root/.cache/go-build
      - backend_dev_bin:/work/backend/.air
    healthcheck:
      test: ["CMD", "/work/backend/.air/api", "healthcheck"]
      start_period: 180s
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      course-graph:
        condition: service_healthy
  swagger:
    extends:
      file: ./services/backend/docker-compose.yaml
      service: swagger

  frontend:
    extends:
      file: ./services/frontend/docker-compose.yaml
      service: frontend
    build:
      target: dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:?Set VITE_API_BASE_URL in .env}
      VITE_API_PROXY_TARGET: http://api:8002
      DEV_POLLING: "true"
    volumes:
      - ./services/frontend:/app
      - frontend_node_modules:/app/node_modules

  proxy:
    extends:
      file: ./services/caddy/docker-compose.yaml
      service: proxy
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  default:
    name: ai-tutor_default

volumes:
  redpanda_data:
    name: ai-tutor_redpanda_data
  postgres_data:
    name: ai-tutor_postgres_data
  task_audio_data:
    name: ai-tutor_task_audio_data
  caddy_data:
    name: ai-tutor_caddy_data
  caddy_config:
    name: ai-tutor_caddy_config
  backend_go_modules:
  backend_go_build:
  backend_dev_bin:
  frontend_node_modules:
  course_graph_models:
  course_graph_data:
