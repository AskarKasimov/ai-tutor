# Local application stack. The dev override enables source watchers in the same containers.
services:
  db:
    extends:
      file: ./services/postgresql/docker-compose.yaml
      service: db

  s3:
    extends:
      file: ./services/s3/docker-compose.yaml
      service: s3

  redpanda:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: redpanda

  redpanda-init:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: redpanda-init
    depends_on:
      redpanda:
        condition: service_healthy

  llm-gateway:
    build:
      target: runtime
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: llm-gateway
    volumes:
      - ./services/llm-gateway:/work/llm-gateway
      - ./services/shared:/work/shared:ro
    environment:
      GATEWAY_CONFIG: ${GATEWAY_CONFIG:-/work/llm-gateway/config/dev.yaml}
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully

  prometheus:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: prometheus
    profiles: [observability]
    volumes:
      - ./services/llm-gateway/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      llm-gateway:
        condition: service_healthy

  grafana:
    extends:
      file: ./services/llm-gateway/docker-compose.yaml
      service: grafana
    profiles: [observability]
    volumes:
      - ./services/llm-gateway/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/llm-gateway/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

  course-graph:
    build:
      target: runtime
    extends:
      file: ./services/course-graph/docker-compose.yaml
      service: course-graph
    volumes: !override
      - ./services/course-graph/config:/app/config:ro
      - ./services/shared/gen/python/llmgateway:/app/llmgateway:ro
      - course_graph_models:/root/.cache/huggingface
      - course_graph_data:/var/lib/course-graph
    depends_on:
      llm-gateway:
        condition: service_healthy

  api:
    build:
      target: runtime
    extends:
      file: ./services/backend/docker-compose.yaml
      service: api
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_healthy
      course-graph:
        condition: service_healthy
      llm-gateway:
        condition: service_healthy

  swagger:
    extends:
      file: ./services/backend/docker-compose.yaml
      service: swagger

  frontend:
    extends:
      file: ./services/frontend/docker-compose.yaml
      service: frontend

  proxy:
    extends:
      file: ./services/caddy/docker-compose.yaml
      service: proxy
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

networks:
  default:
    name: ai-tutor_default

volumes:
  redpanda_data:
    name: ai-tutor_redpanda_data
  postgres_data:
    name: ai-tutor_postgres_data
  task_audio_data:
    name: ai-tutor_task_audio_data
  gateway_go_modules:
  gateway_go_build:
  gateway_dev_bin:
  caddy_data:
    name: ai-tutor_caddy_data
  caddy_config:
    name: ai-tutor_caddy_config
  course_graph_models:
  course_graph_data:
