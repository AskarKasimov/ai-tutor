      responses:
        '204':
          description: Удалено
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/; без Domain. Браузер сохраняет через Set-Cookie и отправляет
        автоматически. Сервер проверяет активность сессии и роль в базе.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HttpOnly; Secure; SameSite=Lax; Path=/v1/auth; без Domain. Одноразовый refresh-токен; заменяется
        через Set-Cookie.
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      description: Непрозрачный идентификатор. Клиент не разбирает его структуру.
    Timestamp:
      type: integer
      format: int64
      minimum: 0
      description: Unix timestamp в секундах с 1970-01-01T00:00:00Z. Миллисекунды не используются.
      examples:
        - 1790762400
    CourseInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
      required:
        - title
    CoursePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
      minProperties: 1
    ConstituentInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      required:
        - title
        - position
    ConstituentPatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      minProperties: 1
    Constituent:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        position:
          type: integer
          minimum: 0
      required:
        - id
        - course_id
        - title
        - position
    OutcomeInput:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Включить ОР в случайный диагностический пул преподавателя.
      required:
        - title
        - parent_outcome_id
    OutcomePatch:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Включить ОР в случайный диагностический пул преподавателя.
      minProperties: 1
    Outcome:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        constituent_id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        parent_outcome_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        diagnostic_eligible:
          type: boolean
          default: false
          description: Включить ОР в случайный диагностический пул преподавателя.
      required:
        - id
        - constituent_id
        - title
        - parent_outcome_id
        - diagnostic_eligible
    Criterion:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 128
          description: Уникальный внутри задания ключ критерия.
        description:
          type: string
          minLength: 1
      required:
        - key
        - description
    Rubric:
      type: object
      additionalProperties: false
      properties:
        criteria:
          type: array
          items:
            $ref: '#/components/schemas/Criterion'
          minItems: 1
        verdict_rule:
          type: string
          minLength: 1
          description: 'Полные правила принятия решения LLM: когда ответ успешен, а когда есть трудности. В диагностике
            трудности означают назначение тренировки.'
      required:
        - criteria
        - verdict_rule
      description: Ключи критериев должны быть уникальны. LLM обязана проверить каждый критерий и применить verdict_rule;
        сервер проверяет структуру результата, но не переопределяет учебный вердикт.
    TaskInput:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - diagnostic
            - training
        rubric:
          $ref: '#/components/schemas/Rubric'
      required:
        - prompt
        - usage
        - rubric
      examples:
        - prompt: Объясните, почему сложение дробей требует общего знаменателя.
          usage: diagnostic
          rubric:
            criteria:
              - key: common_unit
                description: Студент объясняет необходимость сравнивать одинаковые доли целого.
            verdict_rule: passed, если выполнен критерий common_unit; иначе needs_training. Оценивать смысл ответа,
              а не точное совпадение формулировки.
    TaskPatch:
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - diagnostic
            - training
        rubric:
          $ref: '#/components/schemas/Rubric'
      minProperties: 1
    Task:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        outcome_id:
          $ref: '#/components/schemas/Id'
        prompt:
          type: string
          minLength: 1
        usage:
          type: string
          enum:
            - diagnostic
            - training
        rubric:
          $ref: '#/components/schemas/Rubric'
      required:
        - id
        - outcome_id
        - prompt
        - usage
        - rubric
    PublishedCourse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        revision:
          type: integer
          minimum: 1
        constituents:
          type: array
          items:
            $ref: '#/components/schemas/Constituent'
          minItems: 1
      required:
        - id
        - title
        - revision
        - constituents
    ManagedCourse:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        draft_revision:
          type: integer
          minimum: 1
        published_revision:
          type:
            - integer
            - 'null'
          minimum: 1
        has_unpublished_changes:
          type: boolean
      required:
        - id
        - title
        - draft_revision
        - published_revision
        - has_unpublished_changes
      description: Новый курс имеет draft_revision=1 и published_revision=null. Первое изменение после публикации
        открывает следующую черновую версию; дальнейшие правки относятся к ней. Опубликованный снимок меняется только
        при publish. Все операции преподавателя работают с текущим черновиком.
    CourseDraft:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        title:
          type: string
          minLength: 1
          maxLength: 500
        description:
          type: string
        draft_revision:
          type: integer
          minimum: 1
        published_revision:
          type:
            - integer
            - 'null'
          minimum: 1
        has_unpublished_changes:
          type: boolean
        constituents:
          type: array
          items:
            $ref: '#/components/schemas/Constituent'
        outcomes:
          type: array
          items:
            $ref: '#/components/schemas/Outcome'
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/Task'
      required:
        - id
        - title
        - draft_revision
        - published_revision
        - has_unpublished_changes
        - constituents
        - outcomes
        - tasks
    StartDiagnostic:
      type: object
      additionalProperties: false
      properties:
        course_id:
          $ref: '#/components/schemas/Id'
      required:
        - course_id
      examples:
        - course_id: course_math_1
    Assignment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        constituent_id:
          $ref: '#/components/schemas/Id'
        outcome_id:
          $ref: '#/components/schemas/Id'
        task_id:
          $ref: '#/components/schemas/Id'
        prompt:
          type: string
          minLength: 1
        position:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - awaiting_submission
            - processing
            - evaluated
            - processing_failed
      required:
        - id
        - constituent_id
        - outcome_id
        - task_id
        - prompt
        - position
        - status
    CriterionResult:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
          minLength: 1
        satisfied:
          type: boolean
        explanation:
          type: string
          minLength: 1
      required:
        - key
        - satisfied
        - explanation
    Evaluation:
      type: object
      additionalProperties: false
      properties:
        verdict:
          type: string
          enum:
            - passed
            - needs_training
          description: Вердикт LLM по правилу преподавателя. В тренировке needs_training обозначает оставшиеся трудности,
            но не запускает новое прохождение.
        criterion_results:
          type: array
          items:
            $ref: '#/components/schemas/CriterionResult'
          minItems: 1
        feedback:
          type: string
          minLength: 1
      required:
        - verdict
        - criterion_results
        - feedback
      examples:
        - verdict: needs_training
          criterion_results:
            - key: common_unit
              satisfied: false
              explanation: В ответе не объяснено, почему доли должны иметь одинаковый размер.
          feedback: Попробуйте сначала сравнить половины и четверти одного целого.
    ProcessingFailure:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
            - INVALID_AUDIO
            - TRANSCRIPTION_FAILED
            - EVALUATION_FAILED
        message:
          type: string
          minLength: 1
      required:
        - code
        - message
    Answer:
      type: object
      additionalProperties: false
      properties:
        assignment_id:
          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
            - processing
            - evaluated
            - processing_failed
        submitted_at:
          $ref: '#/components/schemas/Timestamp'
        evaluation:
          oneOf:
            - $ref: '#/components/schemas/Evaluation'
            - type: 'null'
        failure:
          oneOf:
            - $ref: '#/components/schemas/ProcessingFailure'
            - type: 'null'
      required:
        - assignment_id
        - status
        - submitted_at
        - evaluation
        - failure
      description: 'processing: evaluation и failure равны null. processing_failed: failure заполнен, evaluation
        null. evaluated: failure null; evaluation заполнен только после завершения всего прохождения. Поле transcript
        отсутствует.'
      allOf:
        - if:
            properties:
              status:
                const: processing
          then:
            properties:
              evaluation:
                type: 'null'
              failure:
                type: 'null'
        - if:
            properties:
              status:
                const: processing_failed
          then:
            properties:
              evaluation:
                type: 'null'
              failure:
                $ref: '#/components/schemas/ProcessingFailure'
        - if:
            properties:
              status:
                const: evaluated
          then:
            properties:
              failure:
                type: 'null'
      examples:
        - assignment_id: assignment_123
          status: processing
          submitted_at: 1790762400
          evaluation: null
          failure: null
    ConstituentFeedback:
      type: object
      additionalProperties: false
      properties:
        constituent_id:
          $ref: '#/components/schemas/Id'
        verdict:
          type: string
          enum:
            - passed
            - needs_training
        feedback:
          type: string
          minLength: 1
      required:
        - constituent_id
        - verdict
        - feedback
    Feedback:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
        constituents:
          type: array
          items:
            $ref: '#/components/schemas/ConstituentFeedback'
          minItems: 1
      required:
        - summary
        - constituents
    TrainingConstituentFeedback:
      type: object
      additionalProperties: false
      properties:
        constituent_id:
          $ref: '#/components/schemas/Id'
        feedback:
          type: string
          minLength: 1
      required:
        - constituent_id
        - feedback
    TrainingFeedback:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          minLength: 1
        constituents:
          type: array
          items:
            $ref: '#/components/schemas/TrainingConstituentFeedback'
          minItems: 1
      required:
        - summary
        - constituents
    Diagnostic:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        course_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - in_progress
            - evaluating
            - completed
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          minItems: 1
        feedback:
          oneOf:
            - $ref: '#/components/schemas/Feedback'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        training_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
      required:
        - id
        - course_id
        - course_revision
        - status
        - assignments
        - feedback
        - created_at
        - completed_at
        - training_id
      description: Ровно одно задание на составляющую. feedback и completed_at заполнены только в completed. training_id
        заполнен в completed при наличии проблемных составляющих; иначе null. Тренировка закрепляется до завершения
        диагностики, поэтому completed возвращает согласованный итог.
      allOf:
        - if:
            properties:
              status:
                const: completed
          then:
            properties:
              feedback:
                $ref: '#/components/schemas/Feedback'
              completed_at:
                $ref: '#/components/schemas/Timestamp'
          else:
            properties:
              feedback:
                type: 'null'
              completed_at:
                type: 'null'
              training_id:
                type: 'null'
    Training:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        course_id:
          $ref: '#/components/schemas/Id'
        course_revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
            - in_progress
            - evaluating
            - completed
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
          minItems: 1
        feedback:
          oneOf:
            - $ref: '#/components/schemas/TrainingFeedback'
            - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        completed_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        diagnostic_id:
          $ref: '#/components/schemas/Id'
      required:
        - id
        - course_id
        - course_revision
        - status
        - assignments
        - feedback
        - created_at
        - completed_at
        - diagnostic_id
      description: Ровно два разных задания на каждую проблемную составляющую исходной диагностики. feedback и completed_at
        заполнены только в completed.
      allOf:
        - if:
            properties:
              status:
                const: completed
          then:
            properties:
              feedback:
                $ref: '#/components/schemas/TrainingFeedback'
              completed_at:
                $ref: '#/components/schemas/Timestamp'
          else:
            properties:
              feedback:
                type: 'null'
              completed_at:
                type: 'null'
    CourseList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublishedCourse'
      required:
        - items
    ManagedCourseList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedCourse'
      required:
        - items
    DiagnosticList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
      required:
        - items
    TrainingList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Training'
      required:
        - items
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              path:
                type: string
              code:
                type: string
              message:
                type: string
                minLength: 1
            required:
              - code
              - message
      required:
        - code
        - message
      description: code — стабильный машинный код, message — пояснение, details — ошибки отдельных полей или конфигурации
        курса. Учебный вердикт передаётся через Evaluation, а не HTTP-ошибку.
      examples:
        - code: RESOURCE_HAS_CHILDREN
          message: Сначала удалите задания и дочерние ОР.
    RegisterRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: 15–128 символов. Разрешены пробелы и Unicode; пароль не обрезается и не приводится к другому
            регистру. Сервер отклоняет распространённые и скомпрометированные пароли.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - email
        - password
      description: Регистрация создаёт только student. Поле role недопустимо. Аккаунт сразу активен; сессия устанавливается
        двумя HttpOnly cookies.
      examples:
        - email: student@example.edu
          password: Example-passphrase-42
          display_name: Иван
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
          maxLength: 254
          description: Email служит идентификатором входа. Сервер удаляет внешние пробелы и приводит значение к
            нижнему регистру до проверки уникальности.
        display_name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum:
            - student
            - admin
          description: admin — преподаватель, имеет доступ ко всем курсам и редактированию каталога. Назначается
            вручную через SQL.
        created_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - email
        - display_name
        - role
        - created_at
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/SessionExpiry'
      required:
        - user
        - session
      examples:
        - user:
            id: user_123
            email: student@example.edu
            display_name: Иван
            role: student
            created_at: 1790762400
          session:
            access_expires_at: 1790763300
            refresh_expires_at: 1793354400
    SessionExpiry:
      type: object
      additionalProperties: false
      properties:
        access_expires_at:
          $ref: '#/components/schemas/Timestamp'
        refresh_expires_at:
          $ref: '#/components/schemas/Timestamp'
      required:
        - access_expires_at
        - refresh_expires_at
      description: Сроки Unix timestamp в секундах; значения токенов находятся только в HttpOnly cookies. Access
        до 15 минут; сессия 30 суток с входа или регистрации. Refresh не продлевает исходный срок сессии.
      examples:
        - access_expires_at: 1790763300
          refresh_expires_at: 1793354400
  responses:
    Unauthorized:
      description: 'UNAUTHORIZED: access-токен отсутствует, недействителен, истёк или относится к отозванной сессии.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'FORBIDDEN: требуется admin (преподаватель); либо CSRF_ORIGIN_DENIED: недопустимый Origin у изменяющего
        запроса.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Объект не существует, не опубликован или недоступен текущему пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Конфликт состояния: ANSWER_PROCESSING, ANSWER_ALREADY_EVALUATED или RESOURCE_HAS_CHILDREN.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Неверные поля запроса либо неполная конфигурация курса. details содержит конкретные нарушения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: 'AUDIO_TOO_LARGE: запись превышает 25 МиБ.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'UNSUPPORTED_AUDIO_FORMAT: контейнер или кодек записи не поддерживается.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: 'PROCESSING_UNAVAILABLE: запись не принята; можно повторить запрос позднее.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    EmailAlreadyRegistered:
      description: 'EMAIL_ALREADY_REGISTERED: нормализованный email уже занят.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidCredentials:
      description: 'INVALID_CREDENTIALS: email или пароль неверен. Одинаковое сообщение независимо от причины.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidRefreshToken:
      description: 'INVALID_REFRESH_TOKEN: refresh-токен неизвестен, истёк, отозван или уже использован.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthValidationError:
      description: 'VALIDATION_ERROR: некорректные поля; PASSWORD_TOO_WEAK: пароль не соответствует политике. details
        указывает поля.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: 'RATE_LIMITED: превышена частота запросов.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          description: Число секунд до следующей попытки.
          schema:
            type: integer
            minimum: 1
    CsrfRejected:
      description: 'CSRF_ORIGIN_DENIED: Origin отсутствует, равен null или не входит в разрешённый список; операция
        не выполняется.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  parameters:
    TrustedOrigin:
      name: Origin
      in: header
      required: true
      description: Origin frontend, например https://10.10.0.20:5173. Браузер устанавливает автоматически. Сервер
        проверяет точное совпадение схемы, хоста и порта с настроенным списком. Отсутствующий, null или чужой Origin
        возвращает 403 CSRF_ORIGIN_DENIED до выполнения операции.
      schema:
        type: string
        format: uri
    OptionalRefreshCookie:
      name: refresh_token
      in: cookie
      required: false
      description: Браузер отправляет автоматически. При отсутствии cookie logout всё равно удаляет обе cookies
        и возвращает 204.
      schema:
        type: string
