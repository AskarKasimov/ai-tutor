    patch:
      operationId: updateTask
      tags:
        - Преподаватель
      summary: Изменить задание или критерии
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Переданный rubric
        полностью заменяет критерии и правило вердикта в черновике. Опубликованная версия и критерии уже выданных
        заданий остаются прежними.
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
    delete:
      operationId: deleteTask
      tags:
