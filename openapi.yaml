# Контракт для обсуждения и последующей реализации. См. docs/voice-trainer-scenarios.md.
openapi: 3.1.0
info:
  title: Голосовой тренажёр — HTTP API
  version: 0.1.0
  description: 'Проект контракта v0. Диагностика покрывает все составляющие РПД одним заданием на составляющую.
    По вердикту LLM назначается тренировка из двух заданий на проблемную составляющую. Преподаватель редактирует
    записи через форму и публикует неизменяемую версию курса. Все даты — Unix timestamp в секундах с 1970-01-01T00:00:00Z.
    Все коллекции v0 возвращаются полностью; при росте объёма потребуется отдельное решение о пагинации. Auth входит
    в контракт: самостоятельная регистрация по email и паролю создаёт student; admin (преподаватель) создаётся или
    назначается вручную в базе. Все защищённые ручки используют access-токен в HttpOnly cookie. Токены выдаются
    и обновляются через Set-Cookie; в JSON передаются только пользователь и сроки сессии. Роль и владелец прохождения
    определяются сервером по текущему пользователю. Для всех POST/PATCH/DELETE обязателен Origin из точного списка
    разрешённых frontend origins; отсутствующий или null Origin отклоняется с 403 CSRF_ORIGIN_DENIED. Frontend и
    API в v0 работают по HTTPS на одном IP или через frontend proxy; cookies имеют Secure, Domain отсутствует; при разных origins CORS разрешает credentials только для явно указанных
    origins.'
servers:
  - url: /
    description: Текущий сервер
security:
  - accessCookie: []
tags:
  - name: Авторизация
    description: Самостоятельная регистрация студентов, вход, сессии и текущий пользователь.
  - name: Каталог
  - name: Диагностика
  - name: Тренировка
  - name: Ответы
  - name: Преподаватель
paths:
  /v1/auth/register:
    post:
      operationId: register
      tags:
        - Авторизация
      summary: Зарегистрироваться по email и паролю
      description: Создаёт student и сразу возвращает сессию. admin создаётся или назначается вручную в базе. Регистрация,
        вход и обмен токенами в v0 доступны по HTTPS с доверенным сертификатом, включая IP-адреса корпоративной сети. Устанавливает access- и refresh-cookies;
        JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Аккаунт и первая сессия созданы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена
                в секундах>. Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '409':
          $ref: '#/components/responses/EmailAlreadyRegistered'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/login:
    post:
      operationId: login
      tags:
        - Авторизация
      summary: Войти по email и паролю
      description: Создаёт новую независимую сессию. Для неизвестного email и неверного пароля возвращается одинаковый
        INVALID_CREDENTIALS. Роль определяется из текущей записи пользователя. Устанавливает access- и refresh-cookies;
        JSON содержит user и session со сроками, без значений токенов.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена
                в секундах>. Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '422':
          $ref: '#/components/responses/AuthValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/refresh:
    post:
      operationId: refreshTokens
      tags:
        - Авторизация
      summary: Обновить токены текущей сессии
      description: Без тела запроса. Refresh-токен поступает в HttpOnly cookie refresh_token. Успешное
        обновление атомарно заменяет его и устанавливает новый access-токен двумя Set-Cookie. JSON содержит только
        сроки. Исходный срок сессии не продлевается. Старый access-токен действует до своего срока или отзыва сессии.
        Повторное использование старого refresh-токена отзывает всю сессию. Клиент выполняет обновления последовательно;
        браузер сохраняет cookies. Потеря ответа и повтор со старой cookie могут потребовать нового входа. При INVALID_REFRESH_TOKEN
        сервер удаляет обе cookies.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Cookies обновлены; JSON содержит сроки текущей сессии.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionExpiry'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена в секундах>.
                refresh_token: Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=<остаток срока токена
                в секундах>. Domain отсутствует. Значения непрозрачные; токены в JSON не передаются.'
              schema:
                type: string
              example: access_token=example-access-token; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=900
        '401':
          description: 'INVALID_REFRESH_TOKEN: cookie отсутствует, токен неизвестен, истёк, отозван или уже использован.
            Обе cookies удаляются.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token:
                Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе
                cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/auth/logout:
    post:
      operationId: logout
      tags:
        - Авторизация
      summary: Завершить текущую сессию
      description: Без тела запроса. Отзывает сессию по refresh-cookie, включая все её access- и refresh-токены,
        и удаляет обе cookies через Set-Cookie с Max-Age=0 и исходными Path. Другие сессии сохраняются. Если refresh-cookie
        отсутствует, неизвестна, истекла или уже отозвана, возвращает 204 и также удаляет cookies. Access-cookie
        для выхода не требуется; проверка Origin обязательна.
      security: []
      responses:
        '204':
          description: Сессия завершена; токены этой сессии больше не действуют.
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
            Set-Cookie:
              description: 'Два отдельных заголовка Set-Cookie, по одному на cookie; не объединять через запятую.
                access_token: Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0. refresh_token:
                Path=/v1/auth; Secure; HttpOnly; SameSite=Lax; Max-Age=0. Domain отсутствует. Значения пустые; обе
                cookies удаляются.'
              schema:
                type: string
              example: access_token=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
        - $ref: '#/components/parameters/OptionalRefreshCookie'
  /v1/auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Авторизация
      summary: Получить текущего пользователя
      description: Возвращает актуальные данные и роль из базы. Изменение роли через SQL применяется при следующем
        запросе, без нового входа. Пароль и refresh-токен не возвращаются.
      responses:
        '200':
          description: Текущий пользователь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          headers:
            Cache-Control:
              description: Ответ не кэшируется.
              schema:
                type: string
                const: no-store
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/courses:
    get:
      operationId: listPublishedCourses
      tags:
        - Каталог
      summary: Список опубликованных курсов
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getPublishedCourse
      tags:
        - Каталог
      summary: Опубликованный курс и составляющие РПД
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/diagnostics:
    get:
      operationId: listMyDiagnostics
      tags:
        - Диагностика
      summary: История диагностик текущего студента
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: startDiagnostic
      tags:
        - Диагностика
      summary: Начать диагностику курса
      description: Выбирает один случайный диагностический ОР на каждую составляющую РПД, затем одно случайное диагностическое
        задание этого ОР. Используется последняя опубликованная версия курса. Выбор равновероятный сначала среди
        подходящих ОР, затем среди заданий выбранного ОР. Повторный POST создаёт новую диагностику.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartDiagnostic'
      responses:
        '201':
          description: Прохождение создано, задания закреплены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/diagnostics/{diagnosticId}:
    parameters:
      - name: diagnosticId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMyDiagnostic
      tags:
        - Диагностика
      summary: Задания, состояние и итог диагностики
      description: Доступно только владельцу прохождения. Фидбек и назначенная тренировка появляются после завершения
        проверки всех ответов. Повторное чтение не изменяет набор заданий.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Diagnostic'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/trainings:
    get:
      operationId: listMyTrainings
      tags:
        - Тренировка
      summary: Назначенные тренировки текущего студента
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/trainings/{trainingId}:
    parameters:
      - name: trainingId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getMyTraining
      tags:
        - Тренировка
      summary: Задания, состояние и итог тренировки
      description: 'Создаётся системой после диагностики: два разных задания на каждую проблемную составляющую из
        непосредственных дочерних ОР диагностического ОР. После проверки всех ответов возвращается итоговый фидбек.
        Новая тренировка и повторная диагностика автоматически не назначаются.'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Training'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/assignments/{assignmentId}/answer:
    parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: submitVoiceAnswer
      tags:
        - Ответы
      summary: Сдать голосовой ответ на выданное задание
      description: Общая ручка для диагностики и тренировки. Одна запись относится к одному заданию. После технического
        сбоя разрешена новая загрузка на то же задание. Пока ответ обрабатывается или уже оценён, новая загрузка
        возвращает 409. Студент не подтверждает расшифровку. Сохранённый ответ можно прочитать после потери HTTP-ответа
        на загрузку.
      responses:
        '202':
          description: Запись принята, обработка начата
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          $ref: '#/components/responses/Unavailable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                audio:
                  type: string
                  format: binary
                  description: Одна голосовая запись, до 25 МиБ. WAV, Ogg/Opus или WebM/Opus.
              required:
                - audio
            encoding:
              audio:
                contentType: audio/wav, audio/ogg, audio/webm
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
    get:
      operationId: getMyVoiceAnswer
      tags:
        - Ответы
      summary: Состояние обработки и оценка голосового ответа
      description: Используется для опроса после загрузки. Возвращает 404, пока запись не принята. Расшифровка и
        критерии преподавателя студенту не возвращаются. Оценка доступна после завершения всего прохождения; во
        время прохождения ответ содержит только состояние обработки.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Answer'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/admin/courses:
    get:
      operationId: listManagedCourses
      tags:
        - Преподаватель
      summary: Все курсы, доступные admin (преподавателю)
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
    post:
      operationId: createCourse
      tags:
        - Преподаватель
      summary: Создать черновик курса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseInput'
      responses:
        '201':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/admin/courses/{courseId}:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    get:
      operationId: getCourseDraft
      tags:
        - Преподаватель
      summary: Черновик курса со всеми записями для формы
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Составляющие, ОР
        и задания представлены плоскими массивами; дерево строится по parent_outcome_id.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDraft'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      operationId: updateCourse
      tags:
        - Преподаватель
      summary: Изменить сведения о курсе
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoursePatch'
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Требуется роль admin (преподаватель); доступ распространяется на все курсы. '
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
  /v1/admin/courses/{courseId}/publish:
    parameters:
      - name: courseId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    post:
      operationId: publishCourse
      tags:
        - Преподаватель
      summary: Проверить и опубликовать черновик курса
      description: Требуется роль admin (преподаватель); доступ распространяется на все курсы. Проверяет непустой
        набор составляющих, корректность дерева внутри составляющей, наличие хотя бы одного диагностического ОР
        с заданием на составляющую и не менее двух разных тренировочных заданий в непосредственных дочерних ОР каждого
        диагностического ОР. Каждое задание должно иметь критерии и правило вердикта. Публикация сохраняет неизменяемый
        снимок. Начатые прохождения остаются на прежней версии. Повторная публикация без изменений возвращает текущую
        опубликованную версию.
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedCourse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
        - $ref: '#/components/parameters/TrustedOrigin'
