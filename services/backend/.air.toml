root = "."
tmp_dir = ".air"

[build]
cmd = "go build -o ./.air/api ./cmd/api"
entrypoint = ["./.air/api"]
include_ext = ["go", "sql", "mod", "sum"]
exclude_dir = [".air", "bin", ".git"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 300
send_interrupt = true
kill_delay = "2s"
stop_on_error = true
