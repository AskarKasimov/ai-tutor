# Air runs from services/backend; its root is the parent so it also watches
# the shared gRPC contracts (services/shared) the backend imports. Commands
# run in services/backend; watched paths and entrypoint are relative to root.
root = ".."
tmp_dir = "backend/.air"

[build]
cmd = "go build -o ./.air/api ./cmd/api"
entrypoint = ["backend/.air/api"]
include_dir = ["backend", "shared"]
include_ext = ["go", "sql", "mod", "sum"]
exclude_dir = ["backend/.air", "backend/bin", ".git"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 300
send_interrupt = true
kill_delay = "2s"
stop_on_error = true
rerun = true
rerun_delay = 2000
