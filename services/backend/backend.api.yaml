components:
  schemas:
    app.HealthResponse:
      properties:
        status:
          enum:
            - ok
          type: string
      required:
        - status
      type: object
      additionalProperties: false
    assessmenthttp.EvaluateRequest:
      properties:
        correct_answer:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        question:
          type: string
        transcription_id:
          type: string
        voice_instruction:
          type: string
      required:
        - question
        - transcription_id
        - voice_instruction
      type: object
      additionalProperties: false
    assessmenthttp.EvaluateResponse:
      properties:
        feedback:
          items:
            type: string
          type: array
          uniqueItems: false
        score:
          maximum: 2
          minimum: 0
          type: integer
      required:
        - feedback
        - score
      type: object
      additionalProperties: false
    authhttp.LoginRequest:
      properties:
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 1
          type: string
      required:
        - email
        - password
      type: object
      additionalProperties: false
    authhttp.RegisterRequest:
      properties:
        display_name:
          maxLength: 200
          minLength: 1
          type: string
        email:
          format: email
          maxLength: 254
          type: string
        password:
          format: password
          maxLength: 128
          minLength: 15
          type: string
      required:
        - email
        - password
      type: object
      additionalProperties: false
    authhttp.authSession:
      properties:
        session:
          $ref: '#/components/schemas/authhttp.wireExpiry'
        user:
          $ref: '#/components/schemas/authhttp.wireUser'
      required:
        - session
        - user
      type: object
      additionalProperties: false
    authhttp.wireExpiry:
      properties:
        access_expires_at:
          type: integer
        refresh_expires_at:
          type: integer
      required:
        - access_expires_at
        - refresh_expires_at
      type: object
      additionalProperties: false
    authhttp.wireUser:
      properties:
        created_at:
          type: integer
        display_name:
          type:
            - string
            - "null"
        email:
          type: string
        id:
          type: string
        role:
          $ref: '#/components/schemas/user.Role'
      required:
        - created_at
        - display_name
        - email
        - id
        - role
      type: object
      additionalProperties: false
    competencyhttp.ImportResult:
      properties:
        competency_count:
          type: integer
        constituent_count:
          type: integer
        imported_at:
          type: integer
        outcome_count:
          type: integer
        revision:
          type: integer
        task_count:
          type: integer
        unparsed_task_cell_count:
          type: integer
        warnings:
          items:
            $ref: '#/components/schemas/competencyhttp.ImportWarning'
          type: array
          uniqueItems: false
      required:
        - competency_count
        - constituent_count
        - imported_at
        - outcome_count
        - revision
        - task_count
        - unparsed_task_cell_count
        - warnings
      type: object
      additionalProperties: false
    competencyhttp.ImportWarning:
      properties:
        code:
          type: string
        column:
          type: string
        column_index:
          type: integer
        row:
          type: integer
      required:
        - code
        - column
        - column_index
        - row
      type: object
      additionalProperties: false
    fault.Detail:
      properties:
        code:
          type: string
        message:
          type: string
        path:
          type: string
      required:
        - code
        - message
      type: object
      additionalProperties: false
    fault.Error:
      properties:
        code:
          type: string
        details:
          items:
            $ref: '#/components/schemas/fault.Detail'
          type: array
          uniqueItems: false
        message:
          type: string
      required:
        - code
        - message
      type: object
      additionalProperties: false
    taskbankhttp.CurriculumSection:
      properties:
        code:
          type: string
        curriculum_competencies:
          items:
            type: string
          type: array
          uniqueItems: false
        title:
          type: string
      required:
        - code
        - curriculum_competencies
        - title
      type: object
      additionalProperties: false
    taskbankhttp.TaskProfile:
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        competency_id:
          type: string
        competency_name:
          type: string
        constituent_id:
          type: string
        constituent_name:
          type: string
        curriculum_sections:
          items:
            $ref: '#/components/schemas/taskbankhttp.CurriculumSection'
          type: array
          uniqueItems: false
        educational_content:
          type:
            - string
            - "null"
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        outcome_name:
          type: string
        question:
          type: string
        taxonomy_code:
          type:
            - string
            - "null"
        topic_level_code:
          type:
            - string
            - "null"
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - competency_id
        - competency_name
        - constituent_id
        - constituent_name
        - curriculum_sections
        - educational_content
        - id
        - importance
        - include_in_test
        - options
        - origin
        - outcome_id
        - outcome_name
        - question
        - taxonomy_code
        - topic_level_code
        - voice_instruction
      type: object
      additionalProperties: false
    taskbankhttp.TaskSummary:
      properties:
        ald_level_code:
          type:
            - string
            - "null"
        competency_name:
          type: string
        constituent_name:
          type: string
        id:
          type: string
        importance:
          type:
            - integer
            - "null"
        include_in_test:
          type:
            - boolean
            - "null"
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        outcome_name:
          type: string
        question:
          type: string
        taxonomy_code:
          type:
            - string
            - "null"
        topic_level_code:
          type:
            - string
            - "null"
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - ald_level_code
        - competency_name
        - constituent_name
        - id
        - importance
        - include_in_test
        - options
        - origin
        - outcome_id
        - outcome_name
        - question
        - taxonomy_code
        - topic_level_code
        - voice_instruction
      type: object
      additionalProperties: false
    taskgenhttp.GenerateRequest:
      properties:
        outcome_id:
          maxLength: 128
          minLength: 1
          type: string
      required:
        - outcome_id
      type: object
      additionalProperties: false
    taskgenhttp.GeneratedTask:
      properties:
        id:
          type: string
        options:
          items:
            type: string
          type: array
          uniqueItems: false
        origin:
          type: string
        outcome_id:
          type: string
        question:
          type: string
        voice_instruction:
          type:
            - string
            - "null"
      required:
        - id
        - options
        - origin
        - outcome_id
        - question
        - voice_instruction
      type: object
      additionalProperties: false
    taskgenhttp.ImportMaterialRequest:
      properties:
        content:
          type: string
        name:
          type: string
        outcome_ids:
          items:
            type: string
          type: array
          uniqueItems: false
      required:
        - content
        - name
        - outcome_ids
      type: object
      additionalProperties: false
    user.Role:
      enum:
        - student
        - admin
      type: string
      x-enum-varnames:
        - Student
        - Admin
    voicehttp.SynthesizeRequest:
      properties:
        text:
          maxLength: 500
          minLength: 1
          type: string
      required:
        - text
      type: object
      additionalProperties: false
    voicehttp.Transcription:
      properties:
        created_at:
          type: integer
        id:
          type: string
        text:
          type: string
      required:
        - created_at
        - id
        - text
      type: object
      additionalProperties: false
  securitySchemes:
    accessCookie:
      in: cookie
      name: access_token
      type: apiKey
    refreshCookie:
      in: cookie
      name: refresh_token
      type: apiKey
info:
  description: Реализованный HTTP API backend. Даты — Unix timestamp в секундах. Авторизация — HttpOnly Secure cookies.
  title: AI Tutor Backend API
  version: 0.1.0
paths:
  /admin/competency-map/import:
    post:
      description: Доступно только admin. Импорт атомарно заменяет учебную базу.
      operationId: importCompetencyMap
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  description: Карта компетенций CSV или XLSX, до 25 МиБ
                  format: binary
                  type: string
              required:
                - file
              type: object
              additionalProperties: false
        description: Карта компетенций CSV или XLSX, до 25 МиБ
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/competencyhttp.ImportResult'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unsupported Media Type
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      security:
        - accessCookie: []
      summary: Заменить учебную базу картой компетенций
      tags:
        - Учебная база
  /admin/materials:
    post:
      operationId: importMaterial
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taskgenhttp.ImportMaterialRequest'
              summary: request
              description: Текст и связи материала
        description: Текст и связи материала
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
      security:
        - accessCookie: []
      summary: Загрузить учебный материал в контекст RAG
      tags:
        - Учебная база
  /assessments/evaluate:
    post:
      description: Принимает произвольное задание и ID принадлежащей студенту расшифровки. Оценка не сохраняется.
      operationId: evaluateAnswer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/assessmenthttp.EvaluateRequest'
              summary: request
              description: Задание и расшифровка
        description: Задание и расшифровка
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/assessmenthttp.EvaluateResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Request Entity Too Large
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Gateway Timeout
      security:
        - accessCookie: []
      summary: Оценить сохранённый голосовой ответ
      tags:
        - Грейдинг и фидбэк
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authhttp.LoginRequest'
              summary: request
              description: Тело запроса
        description: Тело запроса
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authhttp.authSession'
          description: OK
          headers:
            Set-Cookie:
              description: 'access_token и refresh_token: Path=/; Secure; HttpOnly; SameSite=Lax'
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
      summary: Войти
      tags:
        - Auth
  /auth/logout:
    post:
      description: Refresh cookie необязательна; без неё возвращается 204 и удаляются обе cookies.
      operationId: logout
      responses:
        "204":
          description: Сессия завершена
          headers:
            Set-Cookie:
              description: 'access_token и refresh_token: Path=/; Secure; HttpOnly; SameSite=Lax'
              schema:
                type: string
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
      summary: Завершить сессию
      tags:
        - Auth
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authhttp.wireUser'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
      security:
        - accessCookie: []
      summary: Получить текущего пользователя
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: refreshTokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authhttp.wireExpiry'
          description: OK
          headers:
            Set-Cookie:
              description: 'access_token и refresh_token: Path=/; Secure; HttpOnly; SameSite=Lax'
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
      security:
        - refreshCookie: []
      summary: Обновить токены сессии
      tags:
        - Auth
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/authhttp.RegisterRequest'
              summary: request
              description: Тело запроса
        description: Тело запроса
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/authhttp.authSession'
          description: Created
          headers:
            Set-Cookie:
              description: 'access_token и refresh_token: Path=/; Secure; HttpOnly; SameSite=Lax'
              schema:
                type: string
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      summary: Зарегистрироваться
      tags:
        - Auth
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app.HealthResponse'
          description: OK
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
      summary: Проверить API и подключение к PostgreSQL
      tags:
        - Сервис
  /tasks:
    get:
      operationId: searchTasks
      parameters:
        - description: ID образовательного результата
          in: query
          name: outcome_id
          schema:
            type: string
        - description: ID компетенции
          in: query
          name: competency_id
          schema:
            type: string
        - description: ID составляющей
          in: query
          name: constituent_id
          schema:
            type: string
        - description: Код таксономии
          in: query
          name: taxonomy
          schema:
            type: string
        - description: Код уровня ALDs
          in: query
          name: ald_level
          schema:
            type: string
        - description: Код уровня темы
          in: query
          name: topic_level
          schema:
            type: string
        - description: Точная важность 1–5
          in: query
          name: importance
          schema:
            type: integer
        - description: Минимальная важность 1–5 (включительно)
          in: query
          name: importance_min
          schema:
            type: integer
        - description: Максимальная важность 1–5 (включительно)
          in: query
          name: importance_max
          schema:
            type: integer
        - description: Фильтр включения в тест
          in: query
          name: include_in_test
          schema:
            type: boolean
        - description: Код раздела РПД
          in: query
          name: section
          schema:
            type: string
        - description: Код компетенции РПД
          in: query
          name: curriculum_competency
          schema:
            type: string
        - description: authored или ai_generated
          in: query
          name: origin
          schema:
            type: string
        - description: Максимум 100
          in: query
          name: limit
          schema:
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/taskbankhttp.TaskSummary'
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
      security:
        - accessCookie: []
      summary: Найти задания по свойствам карты
      tags:
        - Банк заданий
  /tasks/generate:
    post:
      operationId: generateTask
      parameters:
        - description: Ключ повтора запроса
          in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/taskgenhttp.GenerateRequest'
              summary: request
              description: Образовательный результат
        description: Образовательный результат
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskgenhttp.GeneratedTask'
          description: Created
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Conflict
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Bad Gateway
      security:
        - accessCookie: []
      summary: Сгенерировать аналог задания
      tags:
        - Банк заданий
  /tasks/{id}:
    get:
      operationId: getTaskProfile
      parameters:
        - description: ID задания
          in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/taskbankhttp.TaskProfile'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Not Found
      security:
        - accessCookie: []
      summary: Получить профиль задания
      tags:
        - Банк заданий
  /voice/syntheses:
    post:
      operationId: synthesizeQuestion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/voicehttp.SynthesizeRequest'
              summary: request
              description: Текст для озвучивания
        description: Текст для озвучивания
        required: true
      responses:
        "200":
          content:
            audio/wav:
              schema:
                type: string
                format: binary
          description: Готовое WAV аудио
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Unprocessable Entity
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Service Unavailable
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/fault.Error'
          description: Gateway Timeout
      security:
        - accessCookie: []
      summary: Озвучить текст
      tags:
        - Голос
  /voice/transcriptions:
    post:
      operationId: transcribeVoice
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                audio:
                  description: WAV, Ogg/Opus или WebM/Opus, до 25 МиБ
                  format: binary
                  type: string
              required:
                - audio
              type: object
              additionalProperties: false
        description: WAV, Ogg/Opus или WebM/Opus, до 25 МиБ
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/voicehttp.Transcription'
          description: OK
        "401":
          content:
