server:
  listen_address: ":8002"
logging:
  level: info
voice:
  address: "voice-gateway:8021"
  profile: "geek-default"
  timeout: 120s
uploads:
  max_bytes: 26214400
storage:
  s3:
    endpoint: "http://s3:9000"
    region: us-east-1
    bucket: task-audio
    path_style: true
    timeout: 30s
    create_bucket: true
workers:
  audio:
    count: 1
    poll_interval: 1s
tutor:
  enabled: true
  context:
    task_max_chars: 16000
    history_max_chars: 16000
    summary_max_chars: 4000
course_graph:
  url: "http://course-graph:8000"
  timeout: 0s
llm_gateway:
  address: "llm-gateway:8011"
  timeout: 120s
geek:
  question_limit: 8
