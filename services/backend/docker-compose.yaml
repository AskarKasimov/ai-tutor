services:
  api:
    build:
      context: ../..
      dockerfile: services/backend/Dockerfile
    environment:
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:-postgres://ai_tutor:${DB_PASSWORD:-}@db:5432/ai_tutor?sslmode=disable}
      BACKEND_STT_URL: ${BACKEND_STT_URL:-}
      BACKEND_TTS_URL: ${BACKEND_TTS_URL:-}
      BACKEND_TTS_SEED: ${BACKEND_TTS_SEED:-}
      BACKEND_TTS_CFG_VALUE: ${BACKEND_TTS_CFG_VALUE:-}
      BACKEND_TTS_INFERENCE_TIMESTEPS: ${BACKEND_TTS_INFERENCE_TIMESTEPS:-}
      BACKEND_VOICE_TIMEOUT: ${BACKEND_VOICE_TIMEOUT:?Set BACKEND_VOICE_TIMEOUT in .env}
      BACKEND_LISTEN_ADDRESS: ${BACKEND_LISTEN_ADDRESS:?Set BACKEND_LISTEN_ADDRESS in .env}
      BACKEND_MAX_UPLOAD_BYTES: ${BACKEND_MAX_UPLOAD_BYTES:?Set BACKEND_MAX_UPLOAD_BYTES in .env}
      BACKEND_S3_ENDPOINT: ${BACKEND_S3_ENDPOINT:-}
      BACKEND_S3_REGION: ${BACKEND_S3_REGION:-us-east-1}
      BACKEND_S3_BUCKET: ${BACKEND_S3_BUCKET:?Set BACKEND_S3_BUCKET in .env}
      BACKEND_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      BACKEND_S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      BACKEND_S3_PATH_STYLE: ${BACKEND_S3_PATH_STYLE:-true}
      BACKEND_S3_TIMEOUT: ${BACKEND_S3_TIMEOUT:-30s}
      BACKEND_S3_CREATE_BUCKET: ${BACKEND_S3_CREATE_BUCKET:-false}
      BACKEND_COURSE_GRAPH_URL: ${BACKEND_COURSE_GRAPH_URL:-http://course-graph:8000}
      BACKEND_LLM_GATEWAY_ADDR: ${BACKEND_LLM_GATEWAY_ADDR:-llm-gateway:8011}
      BACKEND_LLM_TIMEOUT: ${BACKEND_LLM_TIMEOUT:-120s}
      BACKEND_GEEK_GRAPH_FIXTURE: ${BACKEND_GEEK_GRAPH_FIXTURE:-/fixtures/course-graph.json}
      BACKEND_GEEK_GRAPH_FIXTURE_SUBJECT_ID: ${BACKEND_GEEK_GRAPH_FIXTURE_SUBJECT_ID:-}
      BACKEND_GEEK_MAX_QUESTIONS: ${BACKEND_GEEK_MAX_QUESTIONS:-0}
    volumes:
      - ../../api/fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:8002:8002"
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  swagger:
    image: swaggerapi/swagger-ui:v5.32.0
    profiles: [swagger]
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      BASE_URL: /docs
      VALIDATOR_URL: none
      WITH_CREDENTIALS: "true"
    volumes:
      - ../../api/openapi.yaml:/spec/openapi.yaml:ro
    restart: unless-stopped

networks:
  default:
    external: true
    name: ai-tutor_default
