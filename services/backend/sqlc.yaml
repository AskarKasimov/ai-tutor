version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/shared/postgres/migrations"
    queries: "internal/shared/postgres/queries"
    gen:
      go:
        package: "db"
        out: "internal/shared/postgres/sqlcgen"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        emit_empty_slices: true
