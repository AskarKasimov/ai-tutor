services:
  # COURSE_GRAPH_DEVICE=cpu|gpu in .env selects the variant below; the service
  # name, and so the backend address http://course-graph:8000, stays the same.
  course-graph:
    extends:
      service: course-graph-${COURSE_GRAPH_DEVICE:-cpu}
    profiles: !reset []

  # Variants are only bases of course-graph and never start on their own.
  course-graph-cpu:
    profiles: [course-graph-variant]
    build:
      context: ../..
      dockerfile: services/course-graph/Dockerfile
      target: dev
      args:
        PYTHON_BASE_IMAGE: ${COURSE_GRAPH_BASE_IMAGE:-python:3.11-slim}
        INSTALL_DOCLING: ${COURSE_GRAPH_INSTALL_DOCLING:-true}
        TORCH_BACKEND: cpu
    environment:
      COURSE_GRAPH_CONFIG: ${COURSE_GRAPH_CONFIG:-/app/config/dev.yaml}
      COURSE_GRAPH_DEVICE: cpu
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      HF_HUB_DOWNLOAD_TIMEOUT: ${HF_HUB_DOWNLOAD_TIMEOUT:-30}
    volumes:
      - ./course_graph:/app/course_graph
      - ./config:/app/config:ro
      - ../shared/gen/python/llmgateway:/app/llmgateway:ro
      - course_graph_models:/root/.cache/huggingface
      - course_graph_data:/var/lib/course-graph
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${COURSE_GRAPH_MEMORY_LIMIT:-8G}
    restart: unless-stopped

  # Needs an NVIDIA GPU with driver 570+ and the NVIDIA Container Toolkit
  # (Docker Desktop with WSL 2 on Windows).
  course-graph-gpu:
    extends:
      service: course-graph-cpu
    build:
      args:
        TORCH_BACKEND: cu128
    environment:
      COURSE_GRAPH_DEVICE: gpu
    gpus: all

volumes:
  course_graph_models:
  course_graph_data:

networks:
  default:
    external: true
    name: ai-tutor_default
