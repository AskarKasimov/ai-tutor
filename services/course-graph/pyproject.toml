[project]
name = "course-graph"
version = "0.1.0"
description = "Course knowledge graph and document OCR service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "grpcio>=1.75.1,<2",
    "protobuf>=6.32.1,<7",
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<4",
]

[project.optional-dependencies]
ocr = ["docling==2.139.0"]
cpu = ["torch", "torchvision"]
gpu = [
    "torch; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchvision; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "gpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Generated llmgateway.v1 stubs live in services/shared and are not copied here.
pythonpath = [".", "../shared/gen/python"]
