[project]
name = "course-graph"
version = "0.1.0"
description = "Course knowledge graph and document OCR service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0.0",
    "pypdf>=4.0.0",
    "docling==2.139.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "grpcio>=1.70,<2",
    "protobuf>=5.29,<7",
    "numpy>=1.26,<3",
    "sentence-transformers>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
