services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command: [redpanda, start, --mode, dev-container, --smp, "1", --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092", --advertise-kafka-addr, "internal://redpanda:9092,external://localhost:19092"]
    ports: ["127.0.0.1:19092:19092"]
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk topic create llm.requests.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic create llm.state.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic alter-config llm.requests.v1 --set retention.ms=604800000 --set max.message.bytes=2097152 --brokers redpanda:9092; rpk topic alter-config llm.state.v1 --set cleanup.policy=compact --set retention.ms=-1 --set max.message.bytes=41943040 --brokers redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy

  llm-gateway:
    build:
      context: ../..
      dockerfile: services/llm-gateway/Dockerfile
      target: dev
    environment:
      GATEWAY_CONFIG: ${GATEWAY_CONFIG:-/work/llm-gateway/config/dev.yaml}
    volumes:
      - .:/work/llm-gateway
      - ../shared:/work/shared:ro
      - gateway_go_modules:/go/pkg/mod
      - gateway_go_build:/root/.cache/go-build
      - gateway_dev_bin:/work/llm-gateway/.air
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8010/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [gateway]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    expose: [9090]
    depends_on:
      - llm-gateway
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [gateway]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

networks:
  default:
    external: true
    name: ai-tutor_default

volumes:
  gateway_go_modules:
  gateway_go_build:
  gateway_dev_bin:
  redpanda_data:
    name: ai-tutor_redpanda_data
