services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command: [redpanda, start, --mode, dev-container, --smp, "1", --rpc-addr, "0.0.0.0:33145", --advertise-rpc-addr, "redpanda:33145", --seeds, "redpanda:33145", --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092", --advertise-kafka-addr, "internal://redpanda:9092,external://localhost:19092"]
    ports: ["127.0.0.1:19092:19092"]
    volumes: [redpanda_data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers 127.0.0.1:9092 >/dev/null 2>&1 && rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    entrypoint: ["/bin/sh", "-c"]
    command: ["rpk topic create llm.requests.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic create llm.state.v1 --partitions 1 --replicas 1 --brokers redpanda:9092 || true; rpk topic alter-config llm.requests.v1 --set retention.ms=604800000 --set max.message.bytes=2097152 --brokers redpanda:9092; rpk topic alter-config llm.state.v1 --set cleanup.policy=compact --set retention.ms=-1 --set max.message.bytes=41943040 --brokers redpanda:9092"]
    depends_on:
      redpanda:
        condition: service_healthy

  llm-gateway:
    build:
      context: ../..
      dockerfile: services/llm-gateway/Dockerfile
    environment:
      GATEWAY_CONFIG: /etc/llm-gateway/config.json
    volumes:
      - ./config.json:/etc/llm-gateway/config.json:ro
    ports:
      - "127.0.0.1:8010:8010"
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "wget -q -O /dev/null http://127.0.0.1:8010/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

networks:
  default:
    external: true
    name: ai-tutor_default

volumes:
  redpanda_data:
    name: ai-tutor_redpanda_data
