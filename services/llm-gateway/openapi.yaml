components:
  schemas:
    gateway.Message:
      properties:
        content:
          type: string
        role:
          type: string
          enum:
            - system
            - user
            - assistant
      required:
        - content
        - role
      type: object
      additionalProperties: false
    gateway.OpenAPICompletion:
      properties:
        choices:
          items:
            additionalProperties: {}
            type: object
          type: array
          uniqueItems: false
        created:
          type: integer
        id:
          type: string
        model:
          type: string
        object:
          enum:
            - chat.completion
          type: string
        usage:
          additionalProperties: {}
          type: object
      required:
        - choices
        - created
        - id
        - model
        - object
      type: object
    gateway.OpenAPIError:
      properties:
        error:
          $ref: '#/components/schemas/gateway.OpenAPIErrorBody'
      required:
        - error
      type: object
    gateway.OpenAPIErrorBody:
      properties:
        code:
          type: string
        message:
          type: string
        param: {}
        type:
          type: string
      required:
        - code
        - message
        - param
        - type
      type: object
    gateway.OpenAPIRequest:
      properties:
        complexity:
          enum:
            - low
            - medium
            - high
          type: string
        frequency_penalty:
          type: number
          minimum: -2
          maximum: 2
        max_completion_tokens:
          type: integer
          minimum: 1
          x-mutually-exclusive:
            - max_tokens
        max_tokens:
          type: integer
          minimum: 1
          x-mutually-exclusive:
            - max_completion_tokens
        messages:
          items:
            $ref: '#/components/schemas/gateway.Message'
          type: array
          uniqueItems: false
          minItems: 1
        n:
          type: integer
          enum:
            - 1
        presence_penalty:
          type: number
          minimum: -2
          maximum: 2
        reasoning_effort:
          enum:
            - low
            - medium
            - high
          type: string
        response_format:
          additionalProperties: false
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - text
                - json_object
        seed:
          type: integer
        stop:
          oneOf:
            - type: string
            - type: array
              minItems: 1
              maxItems: 4
              items:
                type: string
        stream:
          type: boolean
          enum:
            - false
        temperature:
          type: number
          minimum: 0
          maximum: 2
        top_p:
          type: number
          minimum: 0
          maximum: 1
        urgent:
          type: boolean
      required:
        - complexity
        - messages
      type: object
      additionalProperties: false
info:
  description: Internal server-to-server OpenAI-compatible completion API.
  title: LLM Gateway API
  version: 1.0.0
paths:
  /health/live:
    get:
      responses:
        "200":
          description: OK
  /health/ready:
    get:
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
  /metrics:
    get:
      responses:
        "200":
          content:
            text/plain:
              schema:
                type: string
          description: OK
  /v1/chat/completions:
    post:
      parameters:
        - description: Durable replay key
          in: header
          name: Idempotency-Key
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gateway.OpenAPIRequest'
              summary: request
              description: Completion request
        description: Completion request
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPICompletion'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Bad Request
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Request Entity Too Large
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Too Many Requests
        "502":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Service Unavailable
        "504":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/gateway.OpenAPIError'
          description: Gateway Timeout
      summary: Queue and execute a chat completion
openapi: 3.1.0
servers:
  - url: https://localhost:8443/llm-gateway
