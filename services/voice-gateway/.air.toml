root = ".."
tmp_dir = "voice-gateway/.air"

[build]
cmd = "GOWORK=off GOMAXPROCS=2 go build -p 1 -o ./.air/voice-gateway ./cmd/voice-gateway"
entrypoint = ["voice-gateway/.air/voice-gateway"]
include_dir = ["voice-gateway", "shared"]
include_ext = ["go", "mod", "sum", "proto", "yaml", "yml"]
exclude_dir = ["voice-gateway/.air", ".git"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
poll = true
poll_interval = 500
delay = 300
send_interrupt = true
kill_delay = "20s"
stop_on_error = true
